  // Mapa {id: registro} a partir do formato atual ou da lista antiga.
  function asMap(v){if(Array.isArray(v)){const o={};v.forEach(x=>{if(x&&x.id)o[x.id]=x});return o}return Object.assign({},v||{})}
  const CAMPO={refeicao:"refeicoes",hipo:"hipos",extra:"extras"};

  // change = {tipo:"refeicao"|"hipo"|"extra", chave, valor}; valor null apaga o registro.
  async function writeDay(iso,change){
    const had=S.days.get(iso), campo=CAMPO[change.tipo], agora=Date.now();
    const mapa=asMap(had&&had[campo]);
    const previous=mapa[change.chave];
    if(change.valor)mapa[change.chave]=change.valor;else delete mapa[change.chave];
    const next=Object.assign({},had||{},{[campo]:mapa,data:iso,atualizadoEm:agora});
    // Se o campo ainda está no formato de lista, o update substituiria a lista inteira: grava o mapa completo uma vez.
    const parte=Array.isArray(had&&had[campo])?mapa:{[change.chave]:withClearedFields(previous,change.valor)||null};
    const delta={[campo]:parte,data:iso,atualizadoEm:agora};
    const vazio=!Object.values(next.refeicoes||{}).some(Boolean)&&!listOf(next.hipos).length&&!listOf(next.extras).length;
    const apply=()=>{if(vazio&&S.mode!=="db")S.days.delete(iso);else S.days.set(iso,next)};
    const rollback=()=>{if(had)S.days.set(iso,had);else S.days.delete(iso)};
    setEditorSaving(true);
    try{
      await optimisticCommit(apply,rollback,()=>persist(iso,next,delta));
      closeEditor();toast(change.valor?"Registro salvo":"Registro apagado");return true;
    }
    catch(e){
      setEditorSaving(false);
      if(e&&e.code==="invalid_argument"){
        S.readOnly=true;
        const form=$("form")||$("hform")||$("xform"),submitButton=form&&form.querySelector('button[type="submit"]');
        if(submitButton)submitButton.disabled=true;
        toast("Sem permissão para salvar");
      }
      else if(e&&e.code==="quota_exceeded")toast("Armazenamento cheio. Baixe a planilha e peça para arquivar dias antigos.");
      else toast("Não foi possível salvar. Tente de novo.");
      return false;
    }
  }

  /* ---------- dica dos gráficos ---------- */
  // Qualquer elemento de gráfico com data-tip mostra a dica ao passar o mouse ou tocar (no celular não existe hover).
  function showTip(el,x,y){
    let t=$("charttip");if(!t){t=document.createElement("div");t.id="charttip";t.className="charttip";t.setAttribute("role","status");document.body.appendChild(t)}
    t.textContent=el.dataset.tip;t.hidden=false;
    const r=t.getBoundingClientRect(), W=document.documentElement.clientWidth;
    t.style.left=Math.max(8,Math.min(W-r.width-8,x-r.width/2))+"px";t.style.top=Math.max(8,y-r.height-14)+"px";
  }
  function hideTip(){const t=$("charttip");if(t)t.hidden=true}
  document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&e.pointerType==="mouse")showTip(el,e.clientX,e.clientY);else if(e.pointerType==="mouse")hideTip()});
  document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el,e.clientX,e.clientY);else hideTip()});
  window.addEventListener("scroll",hideTip,{passive:true});

    if(t.dataset.extra){openExtra(S.date,t.dataset.extra);return}
    if(t.dataset.hwindow!==undefined){S.histWindow=Number(t.dataset.hwindow);S.histPage=1;renderView();return}
    if(t.dataset.hpage!==undefined){S.histPage=Number(t.dataset.hpage);renderView();window.scrollTo(0,0);return}
    if(t.dataset.tagf!==undefined){S.tagFilter=t.dataset.tagf||null;S.histPage=1;renderView();return}
    if(t.dataset.open){S.date=t.dataset.open;S.tab="dia";render();window.scrollTo(0,0);return}
    if(t.dataset.period!==undefined){S.period=Number(t.dataset.period);S.copyText=null;renderView();return}
    if(t.id==="conflict-reload"){
      const ed={...S.editing};
      if(ed.kind==="meal")openEditor(ed.iso,ed.k);else if(ed.kind==="hipo")openHipo(ed.iso,ed.id);else openExtra(ed.iso,ed.id);
      toast("Versão mais recente carregada");return;
    }
    if(t.id==="conflict-force"){
      S.editing.force=true;S.editing.conflict=false;
      if(S.editing.kind==="meal")submit();else if(S.editing.kind==="hipo")submitHipo();else submitExtra();return;
    }
    if(t.dataset.remover){const m=S.acessoDados&&S.acessoDados.membros.find(x=>x.user_id===t.dataset.remover);
      if(m&&confirm(`Remover o acesso de ${m.nome||m.email}? Os registros que essa pessoa fez continuam no diário.`))acaoAcesso(()=>S.acesso.remover(m.user_id),"Acesso removido.");return}
    if(t.dataset.cancelar){acaoAcesso(()=>S.acesso.cancelarConvite(t.dataset.cancelar),"Convite cancelado.");return}
    switch(t.id){
      case "login-google":S.sb.entrarComGoogle().catch(()=>toast("Não foi possível abrir o login do Google."));break;
      case "conta-sair":S.sb.sair().finally(()=>location.reload());break;
      case "conta-verificar":S.mode="loading";render();abrirDiario().catch(()=>{S.mode="offline";render()});break;
      case "diario-criar":t.disabled=true;S.sb.criarDiario("").then(abrirDiario).catch(()=>{t.disabled=false;toast("Não foi possível criar o diário.")});break;
      case "prev":S.date=addDays(S.date,-1);render();break;
      case "next":if(S.date<todayIso()){S.date=addDays(S.date,1);render()}break;
      case "gotoday":S.date=todayIso();render();break;
      case "close":case "cancel":closeEditor();break;
      case "add-hipo":openHipo(S.date,null);break;
      case "add-extra":openExtra(S.date,null);break;
      case "del":$("del-wrap").hidden=true;$("del-confirm").hidden=false;break;
      case "del-no":$("del-wrap").hidden=false;$("del-confirm").hidden=true;break;
      case "del-yes":{
        const ed=S.editing;
        if(ed.kind==="hipo")writeDay(ed.iso,{tipo:"hipo",chave:ed.id,valor:null});
        else if(ed.kind==="extra")writeDay(ed.iso,{tipo:"extra",chave:ed.id,valor:null});
        else writeDay(ed.iso,{tipo:"refeicao",chave:ed.k,valor:null});
        break}
      case "plano-edit-btn":showPlanoEdit(true);break;
      case "plano-cancel":$("plano-in").value=S.plano;showPlanoEdit(false);break;
      case "plano-save":{
        const txt=$("plano-in").value.trim();
        try{await savePlano(txt);S.plano=txt;$("plano-text").textContent=txt;$("plano-edit-btn").textContent=txt?"Editar plano":"Anotar o plano da equipe médica";showPlanoEdit(false);toast("Plano salvo")}
        catch(err){toast(err&&err.code==="invalid_argument"?"Sem permissão para salvar":"Não foi possível salvar o plano. Tente de novo.")}
        break}
      case "copy":{
        const txt=summaryText();
        try{await navigator.clipboard.writeText(txt);toast("Resumo copiado");S.copyText=null;renderView()}
        catch(err){S.copyText=txt;renderView();const b=$("copybox");if(b){b.focus();b.select()}toast("Selecione o texto e copie")}
        break}
      case "pdf":{
        if(S.busy)break;
        const dl=await getDownloads();if(!dl)break;
        S.busy=true;renderView();
        let buf;
        try{await ensurePdfLibs();buf=buildPdf()}
        catch(err){S.busy=false;renderView();toast("Não foi possível montar o relatório. Verifique a internet e tente de novo.");break}
        S.busy=false;renderView();
        try{await dl.save({filename:`relatorio-glicemia-${todayIso()}.pdf`,data:buf});toast("Relatório baixado")}
        catch(err){const c=err&&err.code;if(c==="declined")return;if(["unavailable","not_granted","capability_disabled","capability_removed","extension_not_enabled"].includes(c)){S.dlMsg=DL_MSG;renderView()}else toast("Não foi possível baixar agora")}
        break}
      case "bk-export":exportBackup();break;
      case "erase-start":S.eraseConfirm=true;renderView();setTimeout(()=>$("erase-word")&&$("erase-word").focus(),0);break;
      case "erase-cancel":S.eraseConfirm=false;renderView();break;
      case "erase-confirm":eraseAllData();break;
      case "lv-cancel":S.imp.plano=null;setImpMsg(null);renderView();break;
      case "lv-import":importarSensor();break;
      case "bk-cancel":S.backup.plano=null;setBackupMsg(null);renderView();break;
      case "bk-restore":restaurar();break;
      case "csv":{
        const dl=await getDownloads();if(!dl)break;
        try{await dl.save({filename:`glicemia-${todayIso()}.csv`,data:csv()});toast("Planilha baixada")}
        catch(err){const c=err&&err.code;if(c==="declined")return;if(["unavailable","not_granted","capability_disabled","capability_removed","extension_not_enabled"].includes(c)){S.dlMsg=DL_MSG;renderView()}else toast("Não foi possível baixar agora")}
        break}
    }
  });
  document.addEventListener("pointerdown",e=>{const i=e.target.closest&&e.target.closest(".locais label")?.querySelector("input");if(i)i.dataset.era=i.checked?"1":""},true);
  document.addEventListener("click",e=>{const i=e.target.matches&&e.target.matches('input[name="f-local"]')?e.target:null;if(i&&i.dataset.era==="1"){i.checked=false;i.dataset.era=""}});
  document.addEventListener("submit",e=>{
    if(e.target.id==="convite-form"){e.preventDefault();
      const email=$("convite-email").value.trim().toLowerCase(), papel=$("convite-papel").value;
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){S.acessoMsg="Confira o e-mail.";renderView();return}
      acaoAcesso(()=>S.acesso.convidar(email,papel).then(()=>{S.convite={email:"",papel:"cuidador"}}),`Convite feito. ${email} entra quando fizer login com esta conta Google.`);return}
    if(e.target.id==="form"){e.preventDefault();submit()}else if(e.target.id==="hform"){e.preventDefault();submitHipo()}else if(e.target.id==="xform"){e.preventDefault();submitExtra()}});
  document.addEventListener("input",e=>{
    const id=e.target.id;
    if(id==="rep-nome")return;
    if(id==="convite-email"){S.convite.email=e.target.value;return}
    if(id==="erase-word"){const b=$("erase-confirm");if(b)b.disabled=e.target.value.trim()!=="APAGAR"||S.erasing;return}
    if(id==="x-valor"||id==="x-hora"){checkExtra(false);return}
    if(id==="h-valor"||id==="h-nova"||id==="h-hora"){checkHipo(false);return}
    if(id==="f-comeu"){clearTimeout(outrasTimer);outrasTimer=setTimeout(renderOutras,250);return}
    if(id==="f-antes")checkGlu("antes");else if(id==="f-depois")checkGlu("depois");else if(id==="f-ins")checkIns();else if(id==="f-carbo")checkCarbo();
  });
  document.addEventListener("change",async e=>{
    const id=e.target.id;
    if(id==="convite-papel"){S.convite.papel=e.target.value;return}
    if(id==="lv-file"){const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
      try{const r=lerLibreView(await f.text());r.novos=r.isos.filter(iso=>!S.sensor.has(iso)).length;S.imp.plano=r;S.imp.msg=null}
      catch(err){S.imp.plano=null;S.imp.msg=typeof err==="string"?err:NAO_LIBRE}
      renderView();return}
    if(id==="bk-file"){const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
      try{S.backup.plano=planejarRestauracao(lerCopia(await f.text()));S.backup.msg=null}
      catch(err){S.backup.plano=null;S.backup.msg=typeof err==="string"?err:COPIA_INVALIDA}
      renderView();return}
    if(id==="x-lo"||id==="x-hi"){const other=$(id==="x-lo"?"x-hi":"x-lo");if(e.target.checked)other.checked=false;const v=$("x-valor");v.disabled=$("x-lo").checked||$("x-hi").checked;if(v.disabled)v.value="";checkExtra(false);return}
    if(id==="rep-nome"){if(DEMO)return;const nome=e.target.value.trim();if(nome===S.nome)return;const antes=S.nome;S.nome=nome;renderTop();
      try{await saveNome(nome);toast(nome?"Nome salvo":"Nome removido")}catch(err){S.nome=antes;renderTop();toast("Não foi possível salvar o nome")}return}
    if(e.target.id==="h-lo"){const v=$("h-valor");v.disabled=e.target.checked;if(e.target.checked)v.value="";checkHipo(false)}});
  document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(S.editing){if(S.editing.saving){toast("Aguarde o salvamento terminar");return}closeEditor()}});
  $("datepick").addEventListener("change",e=>{const v=e.target.value;if(v&&v<=todayIso()){S.date=v;render()}});

  setInterval(()=>{if(S.tab==="dia"&&!S.editing){if(S.date>todayIso())S.date=todayIso();renderView()}},60000);

  try{S.nome=localStorage.getItem(LOCAL_KEY+"-nome")||""}catch(e){}
  render();
  startDb();
  // Instalação como aplicativo e abertura sem internet só fazem sentido com o site hospedado por conta própria.
  // Dentro do Claude (window.claude existe), o Artifact já é servido pela plataforma: não registra service worker.
  if(!window.claude&&"serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1"))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
