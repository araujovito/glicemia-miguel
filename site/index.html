        <div class="field"><label for="h-novahora">Horário</label><input class="in" type="time" id="h-novahora" value="${esc(x.novaHora||"")}"></div>
      </div>
      <div class="field"><label for="h-obs">Observações <span class="hint">(se necessário)</span></label><textarea class="in" id="h-obs" rows="2" placeholder="Ex.: estava brincando, não quis comer no lanche">${esc(x.obs||"")}</textarea></div>
      <div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button type="submit" class="btn primary" ${ro?"disabled":""}>Salvar</button></div>
      ${id&&!ro?delBlock("Apagar este registro de hipoglicemia?"):""}
    </form></div>`;
    checkHipo(false);fillNames();
  }
  function checkHipo(strict){
    let ok=true;
    const hw=$("w-hora");
    if(strict&&!$("h-hora").value){hw.className="err";hw.textContent="Informe o horário.";ok=false}else hw.textContent="";
    const lo=$("h-lo").checked, vw=$("w-valor"), v=lo?null:parseNum($("h-valor").value);
    if(Number.isNaN(v)){vw.className="err";vw.textContent="Use só números (ex.: 58).";ok=false}
    else if(v!=null&&(v<20||v>600)){vw.className="warn";vw.textContent="Valor fora do comum. Confira antes de salvar."}
    else vw.textContent="";
    const nw=$("w-nova"), n=parseNum($("h-nova").value);
    if(Number.isNaN(n)){nw.className="err";nw.textContent="Use só números.";ok=false}
    else if(n!=null&&(n<20||n>600)){nw.className="warn";nw.textContent="Valor fora do comum. Confira."}
    else nw.textContent="";
    return ok;
  }
  function submitHipo(){
    if(!checkHipo(true)){toast("Corrija os campos marcados");return}
    const {iso,id}=S.editing, prev=(id&&hiposOf(iso).find(h=>h.id===id))||{};
    const lo=$("h-lo").checked;
    const sit=document.querySelector('input[name="h-sit"]:checked');
    const h={id:id||("h"+Date.now().toString(36)),hora:$("h-hora").value,valor:lo?null:parseNum($("h-valor").value),lo:lo||null,
      situacao:sit?sit.value:"",sintomas:[...document.querySelectorAll('input[name="h-sin"]:checked')].map(i=>i.value),
      tratamento:$("h-trat").value.trim(),nova:parseNum($("h-nova").value),novaHora:$("h-novahora").value,obs:$("h-obs").value.trim(),
      criadoEm:prev.criadoEm||Date.now(),atualizadoEm:Date.now(),...autoria(prev)};
    const clean={};Object.entries(h).forEach(([a,b])=>{if(has(b)&&!(Array.isArray(b)&&!b.length))clean[a]=b});
    writeDay(iso,{tipo:"hipo",chave:clean.id,valor:clean});
  }
  function showPlanoEdit(on){
    $("plano-edit").hidden=!on;
    const btn=$("plano-edit-btn");if(btn)btn.hidden=on;
    $("plano-view").hidden=on||!S.plano;$("plano-empty").hidden=on||!!S.plano;
    if(on)$("plano-in").focus();
  }

  function renderExtraSheet(root){
    const {iso,id}=S.editing, x=(id&&extrasOf(iso).find(e=>e.id===id))||{};
    const hora=x.hora||(!id&&iso===todayIso()?nowHHMM():"");
    const ro=S.readOnly||S.mode==="offline";
    root.innerHTML=`<div class="scrim"><form class="sheet" id="xform" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
      <header><div><h3 id="sheet-title">Medição extra</h3><p>${esc(longDate(iso))}</p>${autoriaLinha(x)}</div><button type="button" class="iconbtn" id="close" aria-label="Fechar">×</button></header>
      <p class="hint" style="margin:6px 0 0">Para medições fora das refeições. Não entra nas médias por refeição.</p>
      <div class="pair">
        <div class="field"><label for="x-hora">Horário</label><input class="in" type="time" id="x-hora" value="${esc(hora)}"><div id="w-xhora"></div></div>
        <div class="field"><label for="x-valor">Glicemia</label><div class="suffix"><input id="x-valor" inputmode="numeric" autocomplete="off" value="${has(x.valor)?esc(x.valor):""}" placeholder="—" ${x.lo||x.hi?"disabled":""}><span>mg/dL</span></div><div id="w-xvalor"></div></div>
      </div>
      <div class="opts" style="margin-top:10px">
        <label class="check"><input type="checkbox" id="x-lo" ${x.lo?"checked":""}> Aparelho mostrou “LO”</label>
        <label class="check"><input type="checkbox" id="x-hi" ${x.hi?"checked":""}> Aparelho mostrou “HI”</label>
      </div>
      <div class="field"><span style="font-weight:700">Momento</span><div class="opts" role="radiogroup" aria-label="Momento">
        ${MOMENTOS.map(t=>`<label class="opt"><input type="radio" name="x-mom" value="${esc(t)}" ${x.momento===t?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div></div>
      <div class="field"><label for="x-obs">Observações <span class="hint">(se necessário)</span></label><textarea class="in" id="x-obs" rows="2" placeholder="Ex.: acordou com sede, estava resfriado">${esc(x.obs||"")}</textarea></div>
      <div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button type="submit" class="btn primary" ${ro?"disabled":""}>Salvar</button></div>
      ${id&&!ro?delBlock("Apagar esta medição?"):""}
    </form></div>`;
    checkExtra(false);fillNames();
  }
  function checkExtra(strict){
    let ok=true;
    const hw=$("w-xhora");
    if(strict&&!$("x-hora").value){hw.className="err";hw.textContent="Informe o horário.";ok=false}else hw.textContent="";
    const fixed=$("x-lo").checked||$("x-hi").checked, vw=$("w-xvalor"), v=fixed?null:parseNum($("x-valor").value);
    if(Number.isNaN(v)){vw.className="err";vw.textContent="Use só números (ex.: 180).";ok=false}
    else if(strict&&!fixed&&v==null){vw.className="err";vw.textContent="Informe a glicemia ou marque LO/HI.";ok=false}
    else if(v!=null&&(v<20||v>600)){vw.className="warn";vw.textContent="Valor fora do comum. Confira antes de salvar."}
    else vw.textContent="";
    return ok;
  }
  function submitExtra(){
    if(!checkExtra(true)){toast("Corrija os campos marcados");return}
    const {iso,id}=S.editing, prev=(id&&extrasOf(iso).find(e=>e.id===id))||{};
    const lo=$("x-lo").checked, hi=$("x-hi").checked, mom=document.querySelector('input[name="x-mom"]:checked');
    const x={id:id||("x"+Date.now().toString(36)),hora:$("x-hora").value,valor:lo||hi?null:parseNum($("x-valor").value),lo:lo||null,hi:hi||null,
      momento:mom?mom.value:"",obs:$("x-obs").value.trim(),criadoEm:prev.criadoEm||Date.now(),atualizadoEm:Date.now(),...autoria(prev)};
    const clean={};Object.entries(x).forEach(([a,b])=>{if(has(b))clean[a]=b});
    writeDay(iso,{tipo:"extra",chave:clean.id,valor:clean});
  }

  function openExtra(iso,id){S.editing={kind:"extra",iso,id:id||null};renderSheet()}
  function renderFotos(){
    const box=$("fotos"), d=S.fotoDraft;if(!box||!d)return;
    const ro=S.readOnly||S.mode==="offline", canAdd=!!S.assets&&!ro;
    box.innerHTML=d.cur.map(id=>`<div class="foto"><button type="button" class="foto-open" data-foto="${esc(id)}" aria-label="Ver foto do prato"><img data-foto="${esc(id)}" src="${esc(fotoUrl(id))}" alt="Foto do prato"></button>${canAdd?`<button type="button" class="foto-rm" data-rmfoto="${esc(id)}" aria-label="Remover foto">×</button>`:""}</div>`).join("")
      +(d.busy?`<div class="foto loading">Enviando…</div>`:"")
      +(canAdd&&!d.busy&&d.cur.length<MAX_FOTOS?`<label class="foto-add">+ Foto<input type="file" id="f-foto" accept="image/*" aria-label="Adicionar foto do prato"></label>`:"");
    if(!canAdd&&!d.cur.length)box.innerHTML=`<span class="hint">Fotos não disponíveis nesta tela. Abra pelo link do Claude, com permissão de edição.</span>`;
  }
  function withTimeout(p,ms,code){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code}),ms))])}
  async function loadImage(file){
    if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}}
    const src=URL.createObjectURL(file);
    return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej({code:"decode"});img.src=src})
      .finally(()=>setTimeout(()=>URL.revokeObjectURL(src),1000));
  }
  async function compressImage(file){
    try{
      const img=await withTimeout(loadImage(file),20000,"decode");
      const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,sc=Math.min(1,1280/Math.max(w,h));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      if(img.close)img.close();
      return await withTimeout(new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej({code:"decode"}),"image/jpeg",0.82)),20000,"decode");
    }catch(e){throw e&&e.code?e:{code:"decode"}}
  }
  async function addFoto(file){
    const d=S.fotoDraft;if(!d||!S.assets||!file)return;
    if(d.cur.length>=MAX_FOTOS){toast("Limite de "+MAX_FOTOS+" fotos por refeição");return}
    d.busy=true;renderFotos();
    try{
      const blob=await compressImage(file);
      const r=await withTimeout(S.assets.upload(blob,{type:"image/jpeg"}),90000,"timeout");
      if(S.fotoDraft!==d){S.assets.delete(r.id).catch(()=>{});return}
      S.fotoUrls[r.id]=r.url;d.cur.push(r.id);d.novos.push(r.id);
    }catch(err){
      const c=err&&err.code;
      toast(c==="decode"?"Não foi possível abrir esta foto. Tente outra ou tire uma nova."
        :c==="too_large"?"Foto grande demais. Tente outra."
        :c==="quota_or_state"?"O espaço para fotos está cheio."
        :c==="rate_limited"?"Muitos envios seguidos. Aguarde um pouco e tente de novo."
        :"Não foi possível enviar a foto. Tente de novo.");
    }finally{if(S.fotoDraft===d){d.busy=false;renderFotos()}}
  }
  function removeFotoDraft(id){
    const d=S.fotoDraft;if(!d)return;
    d.cur=d.cur.filter(x=>x!==id);
    if(d.novos.includes(id)){d.novos=d.novos.filter(x=>x!==id);S.assets&&S.assets.delete(id).catch(()=>{})}
    renderFotos();
  }
  function discardDraft(){
    const d=S.fotoDraft;S.fotoDraft=null;
    if(d&&S.assets)d.novos.forEach(id=>S.assets.delete(id).catch(()=>{}));
  }
  function deleteAssets(ids){if(S.assets)ids.forEach(id=>S.assets.delete(id).catch(()=>{}))}
  function openLightbox(id){
    closeLightbox();
    const el=document.createElement("div");el.className="lightbox";el.id="lightbox";el.setAttribute("role","dialog");el.setAttribute("aria-label","Foto do prato");
    el.innerHTML=`<img data-foto="${esc(id)}" src="${esc(fotoUrl(id))}" alt="Foto do prato"><button type="button" class="btn" id="lb-close">Fechar</button>`;
    document.body.appendChild(el);$("lb-close").focus();
  }
  function closeLightbox(){const el=$("lightbox");if(el)el.remove()}

  function openEditor(iso,k){
    const m=mealOf(iso,k)||{};
    S.fotoDraft={orig:[...(m.fotos||[])],cur:[...(m.fotos||[])],novos:[],busy:false};
    S.editing={kind:"meal",iso,k};renderSheet();
  }
  function openHipo(iso,id){S.editing={kind:"hipo",iso,id:id||null};renderSheet()}
  function closeEditor(){S.editing=null;renderSheet();renderView()}

  // Mapa {id: registro} a partir do formato atual ou da lista antiga.
  function asMap(v){if(Array.isArray(v)){const o={};v.forEach(x=>{if(x&&x.id)o[x.id]=x});return o}return Object.assign({},v||{})}
  const CAMPO={refeicao:"refeicoes",hipo:"hipos",extra:"extras"};

  // change = {tipo:"refeicao"|"hipo"|"extra", chave, valor}; valor null apaga o registro.
  async function writeDay(iso,change){
    const had=S.days.get(iso), campo=CAMPO[change.tipo], agora=Date.now();
    const mapa=asMap(had&&had[campo]);
    if(change.valor)mapa[change.chave]=change.valor;else delete mapa[change.chave];
    const next=Object.assign({},had||{},{[campo]:mapa,data:iso,atualizadoEm:agora});
    // Se o campo ainda está no formato de lista, o update substituiria a lista inteira: grava o mapa completo uma vez.
    const parte=Array.isArray(had&&had[campo])?mapa:{[change.chave]:change.valor||null};
    const delta={[campo]:parte,data:iso,atualizadoEm:agora};
    const vazio=!Object.values(next.refeicoes||{}).some(Boolean)&&!listOf(next.hipos).length&&!listOf(next.extras).length;
    if(vazio&&S.mode!=="db")S.days.delete(iso);else S.days.set(iso,next);
    closeEditor();
    try{await persist(iso,next,delta);toast(change.valor?"Registro salvo":"Registro apagado");return true}
    catch(e){
      if(had)S.days.set(iso,had);else S.days.delete(iso);
      if(e&&e.code==="invalid_argument"){S.readOnly=true;toast("Sem permissão para salvar")}
      else if(e&&e.code==="quota_exceeded")toast("Armazenamento cheio. Baixe a planilha e peça para arquivar dias antigos.");
      else toast("Não foi possível salvar. Tente de novo.");
      render();
      return false;
    }
  }

  async function submit(){
    const d=S.fotoDraft;
    if(d&&d.busy){toast("Aguarde a foto terminar de enviar");return}
    const okA=checkGlu("antes"),okD=checkGlu("depois"),okI=checkIns();
    if(!okA||!okD||!okI){toast("Corrija os campos marcados");return}
    const {iso,k}=S.editing, prev=mealOf(iso,k)||{};
    const m={antes:parseNum($("f-antes").value),insulina:parseNum($("f-ins").value),depois:parseNum($("f-depois").value),
             comeu:$("f-comeu").value.trim(),obs:$("f-obs").value.trim(),
             tags:[...document.querySelectorAll('input[name="f-tag"]:checked')].map(i=>i.value),
             fotos:d?d.cur.slice():(prev.fotos||[])};
    if(has(m.antes))m.antesEm=has(prev.antes)&&prev.antesEm?prev.antesEm:(iso===todayIso()?Date.now():null);
    const clean={};Object.entries(m).forEach(([a,b])=>{if(has(b)&&!(Array.isArray(b)&&!b.length))clean[a]=b});
    const valor=mealFilled(clean)?Object.assign(clean,{criadoEm:prev.criadoEm||Date.now(),atualizadoEm:Date.now()},autoria(prev)):null;
    S.fotoDraft=null;
    const ok=await writeDay(iso,{tipo:"refeicao",chave:k,valor});
    if(d){const kept=valor&&valor.fotos||[];
      if(ok)deleteAssets(d.orig.filter(id=>!kept.includes(id)));
      else deleteAssets(d.novos);}
  }

  const DL_MSG="Esta tela do Claude não permite baixar arquivos. Abra o link no navegador (Chrome ou Safari, em claude.ai) e toque de novo. Enquanto isso, use \"Copiar resumo em texto\".";
  async function getDownloads(){
    if(!S.downloads&&window.claude&&window.claude.use){try{S.downloads=await window.claude.use("downloads")}catch(e){}}
    S.dlMsg=S.downloads?null:DL_MSG;
    renderView();
    return S.downloads;
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click",async e=>{
    const t=e.target.closest("button");if(!t)return;
    if(t.id==="lb-close"){closeLightbox();return}
    if(t.dataset.foto){openLightbox(t.dataset.foto);return}
    if(t.dataset.rmfoto){removeFotoDraft(t.dataset.rmfoto);return}
    if(t.dataset.tab){S.tab=t.dataset.tab;S.copyText=null;render();window.scrollTo(0,0);return}
    if(t.dataset.meal){openEditor(S.date,t.dataset.meal);return}
    if(t.dataset.hipo){openHipo(S.date,t.dataset.hipo);return}
    if(t.dataset.extra){openExtra(S.date,t.dataset.extra);return}
    if(t.dataset.tagf!==undefined){S.tagFilter=t.dataset.tagf||null;S.histLimit=20;renderView();return}
    if(t.dataset.open){S.date=t.dataset.open;S.tab="dia";render();window.scrollTo(0,0);return}
    if(t.dataset.period!==undefined){S.period=Number(t.dataset.period);S.copyText=null;renderView();return}
    switch(t.id){
      case "prev":S.date=addDays(S.date,-1);render();break;
      case "next":if(S.date<todayIso()){S.date=addDays(S.date,1);render()}break;
      case "gotoday":S.date=todayIso();render();break;
      case "more":S.histLimit+=20;renderView();break;
      case "close":case "cancel":discardDraft();closeEditor();break;
      case "add-hipo":openHipo(S.date,null);break;
      case "add-extra":openExtra(S.date,null);break;
      case "del":$("del-wrap").hidden=true;$("del-confirm").hidden=false;break;
      case "del-no":$("del-wrap").hidden=false;$("del-confirm").hidden=true;break;
      case "del-yes":{
        const ed=S.editing;
        if(ed.kind==="hipo")writeDay(ed.iso,{tipo:"hipo",chave:ed.id,valor:null});
        else if(ed.kind==="extra")writeDay(ed.iso,{tipo:"extra",chave:ed.id,valor:null});
        else{const d=S.fotoDraft;S.fotoDraft=null;
          writeDay(ed.iso,{tipo:"refeicao",chave:ed.k,valor:null}).then(ok=>{if(!d)return;deleteAssets(ok?[...new Set([...d.orig,...d.novos])]:d.novos)})}
        break}
      case "plano-edit-btn":showPlanoEdit(true);break;
      case "plano-cancel":$("plano-in").value=S.plano;showPlanoEdit(false);break;
      case "plano-save":{
        const txt=$("plano-in").value.trim();
        try{await savePlano(txt);S.plano=txt;$("plano-text").textContent=txt;$("plano-edit-btn").textContent=txt?"Editar plano":"Anotar o plano da equipe médica";showPlanoEdit(false);toast("Plano salvo")}
        catch(err){toast(err&&err.code==="invalid_argument"?"Sem permissão para salvar":"Não foi possível salvar o plano. Tente de novo.")}
        break}
      case "copy":{
        const txt=summaryText();
        try{await navigator.clipboard.writeText(txt);toast("Resumo copiado");S.copyText=null;renderView()}
        catch(err){S.copyText=txt;renderView();const b=$("copybox");if(b){b.focus();b.select()}toast("Selecione o texto e copie")}
        break}
      case "pdf":{
        if(S.busy)break;
        const dl=await getDownloads();if(!dl)break;
        S.busy=true;renderView();
        let buf;
        try{await ensurePdfLibs();buf=buildPdf()}
        catch(err){S.busy=false;renderView();toast("Não foi possível montar o relatório. Verifique a internet e tente de novo.");break}
        S.busy=false;renderView();
        try{await dl.save({filename:`relatorio-glicemia-${todayIso()}.pdf`,data:buf});toast("Relatório baixado")}
        catch(err){const c=err&&err.code;if(c==="declined")return;if(["unavailable","not_granted","capability_disabled","capability_removed","extension_not_enabled"].includes(c)){S.dlMsg=DL_MSG;renderView()}else toast("Não foi possível baixar agora")}
        break}
      case "bk-export":exportBackup();break;
      case "bk-cancel":S.backup.plano=null;setBackupMsg(null);renderView();break;
      case "bk-restore":restaurar();break;
      case "csv":{
        const dl=await getDownloads();if(!dl)break;
        try{await dl.save({filename:`glicemia-${todayIso()}.csv`,data:csv()});toast("Planilha baixada")}
        catch(err){const c=err&&err.code;if(c==="declined")return;if(["unavailable","not_granted","capability_disabled","capability_removed","extension_not_enabled"].includes(c)){S.dlMsg=DL_MSG;renderView()}else toast("Não foi possível baixar agora")}
        break}
    }
  });
  document.addEventListener("submit",e=>{if(e.target.id==="form"){e.preventDefault();submit()}else if(e.target.id==="hform"){e.preventDefault();submitHipo()}else if(e.target.id==="xform"){e.preventDefault();submitExtra()}});
  document.addEventListener("input",e=>{
    const id=e.target.id;
    if(id==="rep-nome")return;
    if(id==="x-valor"||id==="x-hora"){checkExtra(false);return}
    if(id==="h-valor"||id==="h-nova"||id==="h-hora"){checkHipo(false);return}
    if(id==="f-comeu"){clearTimeout(outrasTimer);outrasTimer=setTimeout(renderOutras,250);return}
    if(id==="f-antes")checkGlu("antes");else if(id==="f-depois")checkGlu("depois");else if(id==="f-ins")checkIns();
  });
  document.addEventListener("change",async e=>{
    const id=e.target.id;
    if(id==="bk-fotos"){S.backup.fotos=e.target.checked;return}
    if(id==="bk-file"){const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
      try{S.backup.plano=planejarRestauracao(lerCopia(await f.text()));S.backup.msg=null}
      catch(err){S.backup.plano=null;S.backup.msg=typeof err==="string"?err:COPIA_INVALIDA}
      renderView();return}
    if(id==="f-foto"){const f=e.target.files&&e.target.files[0];e.target.value="";addFoto(f);return}
    if(id==="x-lo"||id==="x-hi"){const other=$(id==="x-lo"?"x-hi":"x-lo");if(e.target.checked)other.checked=false;const v=$("x-valor");v.disabled=$("x-lo").checked||$("x-hi").checked;if(v.disabled)v.value="";checkExtra(false);return}
    if(id==="rep-nome"){const nome=e.target.value.trim();if(nome===S.nome)return;const antes=S.nome;S.nome=nome;renderTop();
      try{await saveNome(nome);toast(nome?"Nome salvo":"Nome removido")}catch(err){S.nome=antes;renderTop();toast("Não foi possível salvar o nome")}return}
    if(e.target.id==="h-lo"){const v=$("h-valor");v.disabled=e.target.checked;if(e.target.checked)v.value="";checkHipo(false)}});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("lightbox"))closeLightbox()});
  document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&t.dataset.foto&&!t.classList.contains("broken")){t.classList.add("broken");t.alt="Foto indisponível"}},true);
  $("datepick").addEventListener("change",e=>{const v=e.target.value;if(v&&v<=todayIso()){S.date=v;render()}});

  setInterval(()=>{if(S.tab==="dia"&&!S.editing){if(S.date>todayIso())S.date=todayIso();renderView()}},60000);

  try{S.nome=localStorage.getItem(LOCAL_KEY+"-nome")||""}catch(e){}
  render();
  startDb();
})();
</script>
