<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E6B74">
<title>Diário de Glicemia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface-2:#E7EEEC; --ink:#15262A; --muted:#566B6E; --line:#D3DEDC;
  --accent:#0E6B74; --accent-ink:#FFFFFF; --accent-soft:#D6ECEC;
  --after:#B5542A; --after-soft:#F7E2D6;
  --warn:#8C5800; --warn-soft:#FBEACB; --ok:#2B7A4C; --ok-soft:#DAEEE0; --danger:#A32D2D;
  --hypo:#B0254A; --hypo-soft:#FBE3E9;
  --shadow:0 10px 30px rgba(10,40,45,.18);
  --f90:.16; --f50:.38;
  --sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1416; --surface:#152022; --surface-2:#1C2A2D; --ink:#E3ECEA; --muted:#92A5A7; --line:#2A3B3E;
    --accent:#5ABEC6; --accent-ink:#062327; --accent-soft:#16393C;
    --after:#EB8E5E; --after-soft:#3A2418;
    --warn:#F0B54A; --warn-soft:#3A2C10; --ok:#6DCB93; --ok-soft:#15301F; --danger:#F08A8A;
    --hypo:#F2809C; --hypo-soft:#3B1621;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    --f90:.30; --f50:.58;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1416; --surface:#152022; --surface-2:#1C2A2D; --ink:#E3ECEA; --muted:#92A5A7; --line:#2A3B3E;
  --accent:#5ABEC6; --accent-ink:#062327; --accent-soft:#16393C;
  --after:#EB8E5E; --after-soft:#3A2418;
  --warn:#F0B54A; --warn-soft:#3A2C10; --ok:#6DCB93; --ok-soft:#15301F; --danger:#F08A8A;
    --hypo:#F2809C; --hypo-soft:#3B1621;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --f90:.30; --f50:.58;
}
*{box-sizing:border-box}
.skip{position:fixed;left:12px;top:8px;z-index:100;transform:translateY(-150%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px}
.skip:focus{transform:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 104px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:1.05rem;letter-spacing:.02em}
.brand h1 span{color:var(--accent)}
.unit{font-size:.8rem;color:var(--muted)}
.datenav{display:flex;align-items:center;gap:8px;margin-top:10px}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.3rem;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}
.datefield{position:relative;flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;padding-inline:10px}
.datefield strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datefield input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.todaybtn{flex:none;height:44px;padding-inline:12px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700}

.banner{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.syncstatus{min-height:22px;margin:2px 0 6px;text-align:right;color:var(--muted);font-size:.82rem;font-weight:600}
.syncstatus.saving{color:var(--warn)} .syncstatus.saved{color:var(--ok)} .syncstatus.error{color:var(--danger)}
.conflict{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:12px;border-radius:12px;margin:10px 0;display:grid;gap:9px}
.conflict .actions{margin:0}

/* resumo do dia */
.daystrip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:16px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.daystrip div{background:var(--surface);padding:10px 8px;text-align:center}
.daystrip b{display:block;font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
.daystrip small{color:var(--muted);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}

/* refeições */
.meals{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.meal{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.meal:hover{border-color:var(--accent)}
.meal.now{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.meal-name{font-weight:700;font-size:1.05rem}
.meal-hint{grid-column:1;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readings{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.rd{display:grid;justify-items:center;min-width:48px;padding:4px 6px;border-radius:10px}
.rd b{font-size:1.25rem;line-height:1.1}
.rd small{font-family:var(--sans);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rd.a{background:var(--accent-soft)} .rd.a b{color:var(--accent)}
.rd.d{background:var(--after-soft)} .rd.d b{color:var(--after)}
.rd.i{background:var(--surface-2)}
.rd.empty b{color:var(--muted);font-weight:500}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.02em}
.chip.now{background:var(--accent);color:var(--accent-ink)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.go{background:var(--warn);color:var(--surface)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.addlabel{grid-row:1 / span 2;grid-column:2;color:var(--accent);font-weight:700}

.note{color:var(--muted);font-size:.82rem;margin-top:18px}

/* seções */
h2{font-size:1.15rem;margin:20px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 12px;font-size:.92rem}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.dayhead strong{text-transform:capitalize}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left}
td.food{text-align:left;color:var(--muted);min-width:9rem}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{white-space:nowrap}
.list{display:grid;gap:12px}
.empty-state{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.75rem}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin:4px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:11px var(--mono)}
.chart .lbl{fill:var(--muted);font:11px var(--sans)}
.chart .val{fill:var(--ink);font:10px var(--mono)}
.chart .ba{fill:var(--accent)} .chart .bd{fill:var(--after)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.mark,.chart .mark.on{opacity:.75}
.chart .wa{stroke:var(--accent)} .chart .wd{stroke:var(--after)}
.chart .med{stroke:var(--surface);stroke-width:2}
details.tabela{margin-top:8px} details.tabela summary{cursor:pointer;color:var(--accent);font-weight:700;padding:6px 0}
.favs{display:flex;flex-wrap:wrap;gap:6px}
.fav{border:1px dashed var(--accent);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:.88rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.fav small{color:var(--muted);margin-left:4px}
.locais{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.locais .opt span{display:flex;justify-content:space-between;gap:6px;border-radius:12px;width:100%}
.locais .opt{display:block}
.locais .opt small{font-weight:400;opacity:.8}
.chart .curva{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .scan{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .mk{stroke:var(--hypo);stroke-width:2} .chart .mkt{fill:var(--hypo);font:10px var(--sans)}
.chart .f90{fill:var(--accent);opacity:var(--f90)} .chart .f50{fill:var(--accent);opacity:var(--f50)}
.charttip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:.82rem;line-height:1.35;max-width:240px;box-shadow:var(--shadow);white-space:pre-line}
.actions{display:grid;gap:10px;margin-top:16px}
.btn{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding-inline:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.copybox{width:100%;min-height:160px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px;font-family:var(--mono);font-size:.8rem}

/* hipoglicemia */
.hipo-add{width:100%;margin-top:12px;height:50px;border-radius:14px;border:2px solid var(--hypo);background:var(--surface);color:var(--hypo);font-weight:700}
.hipos{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.hipo-card{width:100%;text-align:left;border:1px solid var(--hypo);background:var(--hypo-soft);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.hipo-card .top-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hipo-card strong{color:var(--hypo)}
.hipo-card .val{font-family:var(--mono);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.hipo-card small{color:var(--muted);font-size:.85rem}
.tag-hypo{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--hypo);color:var(--surface);font-size:.72rem;font-weight:700;letter-spacing:.03em}
.stat.hypo b{color:var(--hypo)}
.callout{margin-top:10px;padding:12px;border-radius:12px;background:var(--hypo-soft);color:var(--ink);font-size:.92rem;display:grid;gap:8px}
.callout b{color:var(--hypo)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;font-size:.92rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:inline-block;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.9rem;font-weight:600;cursor:pointer}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
input[type=time].in{font-family:var(--mono);font-size:1.2rem;height:54px}

/* etiquetas e medições extras */
.meal-tags{grid-row:3;grid-column:1 / -1;font-size:.8rem;color:var(--accent);font-weight:600}
.tagline{display:block;color:var(--accent);font-size:.8rem;font-weight:600}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.section-head h3{margin:0;font-size:1rem}
.btn.small{height:40px;border-radius:12px;padding-inline:14px;color:var(--accent);border-color:var(--accent)}
.extras{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.extra-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.extra-card .top-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.extra-card .val{font-family:var(--mono);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.extra-card small{color:var(--muted);font-size:.85rem}
.por{color:var(--muted);font-weight:400}
.autoria{font-size:.82rem}
.outras{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.outra{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);display:grid;gap:2px}
.outra .top-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.outra .vals{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.outra .va{color:var(--accent);font-weight:700} .outra .vd{color:var(--after);font-weight:700}
.outra small{color:var(--muted);font-size:.84rem}
.filebtn{position:relative;display:grid;place-items:center;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.restore-plan{margin:8px 0 0;padding-left:18px;font-size:.9rem;display:grid;gap:4px}
.empty-line{color:var(--muted);font-size:.88rem;margin:8px 0 0}

/* conta e pessoas com acesso (fora do Claude) */
.conta{margin-top:12px}
.pessoas{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.pessoas li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.pessoas li span{display:grid;min-width:0}
.pessoas small{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.convite{display:grid;gap:8px;margin-top:14px}
.convite label{font-weight:700}

/* navegação inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;height:60px;font-weight:700;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* folha de edição */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(8,20,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet header{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:6px}
.sheet h3{margin:0;font-size:1.25rem}
.sheet header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-weight:700}
.field .hint{font-size:.82rem;color:var(--muted)}
.field .warn{font-size:.85rem;color:var(--warn);font-weight:600}
.field .err{font-size:.85rem;color:var(--danger);font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.suffix{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.suffix:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.suffix input{flex:1;min-width:0;border:0;background:none;height:54px;padding-inline:12px;font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums;outline:none}
.suffix span{padding-right:12px;color:var(--muted);font-size:.85rem;white-space:nowrap}
.in{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;width:100%}
textarea.in{min-height:74px;resize:vertical}
input.in{height:48px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.group-label{margin-top:18px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sheet .actions{grid-template-columns:1fr 2fr}
.confirm{margin-top:12px;padding:12px;border-radius:12px;background:var(--surface-2);display:grid;gap:10px}
.confirm div{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:380px){
  .rd{min-width:40px;padding:4px}
  .rd b{font-size:1.08rem}
  .daystrip b{font-size:1.05rem}
}
</style>
</head>
<body>
<a class="skip" href="#view">Pular para o conteúdo</a>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="brand">Diário de <span>Glicemia</span></h1><span class="unit">mg/dL · insulina em unidades</span></div>
    <div class="datenav" id="datenav">
      <button class="iconbtn" id="prev" aria-label="Dia anterior">‹</button>
      <div class="datefield"><strong id="datelabel">—</strong><input type="date" id="datepick" aria-label="Escolher data"></div>
      <button class="iconbtn" id="next" aria-label="Próximo dia">›</button>
      <button class="todaybtn" id="gotoday" hidden>Hoje</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="syncstatus" class="syncstatus" role="status" aria-live="polite"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Seções"><div>
  <button data-tab="dia" aria-current="page">Registrar</button>
  <button data-tab="historico">Histórico</button>
  <button data-tab="resumo">Resumo</button>
</div></nav>

<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="logic.js"></script>
<script>
(function(){
  "use strict";
  // logic.js é um arquivo separado. Se ele não foi publicado junto (Artifact publicado só com o index.html),
  // a tela ficaria em branco; em vez disso, explica o que falta.
  if(!window.GlicemiaLogic){
    document.getElementById("view").innerHTML='<div class="banner" role="alert">O site não carregou por completo: falta o arquivo <b>logic.js</b>, que precisa ser publicado junto com o index.html. Os registros não foram afetados.</div>';
    return;
  }

      <p class="note">Você entrou como <b>${esc(S.conta&&S.conta.email)}</b>. Para ver o diário, peça a quem cuida dele para convidar este e-mail (em Resumo → Pessoas com acesso) e toque em “Verificar de novo”.</p>
      <div class="actions"><button type="button" class="btn primary" id="conta-verificar">Verificar de novo</button><button type="button" class="btn" id="conta-sair">Usar outra conta</button></div>
      <p class="note">É o primeiro acesso da família? Crie o diário: você será o dono e poderá convidar os outros cuidadores.</p>
      <div class="actions"><button type="button" class="btn" id="diario-criar">Criar um diário</button></div></section>`;
  }
  const PAPEIS={dono:"Dono",cuidador:"Cuidador: registra",leitor:"Leitor: só vê"};
  function acessoCard(){
    if(!S.acesso)return "";
    const A=S.acessoDados, dono=S.acesso.papel==="dono";
    const lista=!A?`<p class="note">Carregando…</p>`:`<ul class="pessoas">
      ${A.membros.map(m=>`<li><span><strong>${esc(m.nome||m.email)}${m.eu?" (você)":""}</strong><small>${esc(m.email)} · ${PAPEIS[m.papel]}</small></span>
        ${dono&&m.papel!=="dono"?`<button type="button" class="btn small" data-remover="${esc(m.user_id)}">Remover</button>`:""}</li>`).join("")}
      ${A.convites.map(cv=>`<li><span><strong>${esc(cv.email)}</strong><small>Convite pendente · ${PAPEIS[cv.papel]}</small></span>
        <button type="button" class="btn small" data-cancelar="${esc(cv.email)}">Cancelar</button></li>`).join("")}</ul>`;
    const convite=dono?`<form id="convite-form" class="convite" novalidate>
      <label for="convite-email">Convidar pelo e-mail da conta Google</label>
      <input class="in" type="email" id="convite-email" autocomplete="off" inputmode="email" placeholder="nome@gmail.com" value="${esc(S.convite.email)}">
      <select class="in" id="convite-papel" aria-label="Papel">${["cuidador","leitor"].map(p=>`<option value="${p}"${S.convite.papel===p?" selected":""}>${PAPEIS[p]}</option>`).join("")}</select>
      <button type="submit" class="btn primary">Convidar</button></form>`:"";
    return `<section class="card" style="margin-top:12px"><strong>Pessoas com acesso</strong>${lista}${convite}
      <p class="note" id="acesso-msg" role="status"${S.acessoMsg?"":" hidden"}>${esc(S.acessoMsg||"")}</p>
      <div class="actions"><button type="button" class="btn" id="conta-sair">Sair desta conta</button></div></section>`;
  }
  async function carregarAcesso(){
    if(!S.acesso||S.acessoCarregando)return;S.acessoCarregando=true;
    try{S.acessoDados=await S.acesso.listar()}catch(e){S.acessoMsg="Não foi possível carregar a lista de pessoas."}
    finally{S.acessoCarregando=false;if(S.tab==="resumo"&&!S.editing)renderView()}
  }
  async function acaoAcesso(fn,ok){
    try{await fn();S.acessoMsg=ok;S.acessoDados=null;await carregarAcesso()}
    catch(e){S.acessoMsg=e&&e.code==="invalid_argument"?"Sem permissão para isso.":"Não deu certo. Confira a conexão e tente de novo.";renderView()}
  }

  /* ---------- lógica de refeições ---------- */
  function nowMealKey(){
    const d=new Date();const h=d.getHours()+d.getMinutes()/60;
    const m=MEALS.find(x=>h>=x.from&&h<x.to);return m?m.k:null;
  }
  function afterStatus(iso,m){
    if(!m||!has(m.antes)||has(m.depois)||(!m.antesEm&&!m.refeicaoHora))return null;
    const due=reminderDue(iso,m), now=Date.now();if(!due)return null;
    if(now<due)return {cls:"wait",txt:"2h às "+hhmm(due)};
    if(now-due<3*3600e3)return {cls:"go",txt:"Medir 2h agora"};
    return null;
  }

  /* ---------- render ---------- */
  function render(){renderTop();renderView();renderSheet()}

  function renderTop(){
    const onDay=S.tab==="dia";
    const conta=S.mode==="login"||S.mode==="semacesso";
    $("datenav").hidden=!onDay||conta;
    document.querySelector(".tabs").hidden=conta;
    $("datelabel").textContent=longDate(S.date);
    $("brand").innerHTML=S.nome?`Glicemia · <span>${esc(S.nome)}</span>`:`Diário de <span>Glicemia</span>`;
    const dp=$("datepick");dp.value=S.date;dp.max=todayIso();
    $("next").disabled=S.date>=todayIso();
    $("gotoday").hidden=S.date===todayIso();
    const b=$("banner");
    if(S.mode==="demo"){b.hidden=false;b.textContent="Modo de demonstração: todos os nomes, valores e situações desta tela são fictícios. Nada será salvo."}
    else if(S.mode==="local"){b.hidden=false;b.textContent="Os registros estão sendo salvos só neste aparelho e neste navegador. Abra pelo link do Claude para salvar na nuvem."}
    else if(S.mode==="offline"){b.hidden=false;b.textContent="Sem conexão com o armazenamento. Recarregue a página antes de registrar."}
    else if(S.readOnly){b.hidden=false;b.textContent="Você não tem permissão para registrar neste diário. Peça a quem compartilhou o acesso de edição."}
    else b.hidden=true;
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-current",x.dataset.tab===S.tab?"page":"false"));
  }

  function renderView(){
    const v=$("view");
    if(S.mode==="loading"){v.innerHTML='<p class="note">Carregando registros…</p>';return}
    if(S.mode==="login"){v.innerHTML=viewLogin();return}
    if(S.mode==="semacesso"){v.innerHTML=viewSemAcesso();return}
    if(S.tab==="dia")v.innerHTML=viewDay();
    else if(S.tab==="historico")v.innerHTML=viewHistory();
    else{v.innerHTML=viewSummary();if(S.acesso&&!S.acessoDados)carregarAcesso()}
    fillNames();
  }

  function rd(cls,val,label,dec){
    return `<span class="rd ${cls}${has(val)?"":" empty"}"><b>${has(val)?fmt(Number(val),dec||0):"–"}</b><small>${label}</small></span>`;
  }

  function viewDay(){
    const iso=S.date, isToday=iso===todayIso(), nowK=isToday?nowMealKey():null;
    const ms=MEALS.map(x=>mealOf(iso,x.k));
    const antes=ms.filter(m=>m&&has(m.antes)).map(m=>+m.antes);
    const dep=ms.filter(m=>m&&has(m.depois)).map(m=>+m.depois);
    const ins=ms.filter(m=>m&&has(m.insulina)).map(m=>+m.insulina);
    const count=ms.filter(mealFilled).length;
    let h=`<div class="daystrip">
      <div><b>${count}/6</b><small>refeições</small></div>
      <div><b>${fmt(avg(antes))}</b><small>média antes</small></div>
      <div><b>${fmt(avg(dep))}</b><small>média 2h</small></div>
      <div><b>${ins.length?fmt(ins.reduce((a,b)=>a+b,0),1):"–"}</b><small>insulina</small></div>
    </div>`;
    h+=`<button class="hipo-add" id="add-hipo">Registrar hipoglicemia</button>`;
    const hs=hiposOf(iso);
    if(hs.length){
      h+=`<ul class="hipos">`+hs.map(x=>`<li><button class="hipo-card" data-hipo="${esc(x.id)}">
        <span class="top-line"><strong>Hipoglicemia · ${esc(x.hora||"--:--")}</strong><span class="val">${esc(hipoValor(x))}${x.lo||!has(x.valor)?"":" <small>mg/dL</small>"}</span></span>
        ${x.situacao?`<small>${esc(x.situacao)}</small>`:""}
        ${has(x.tratamento)?`<small>Feito: ${esc(x.tratamento)}</small>`:""}
        ${has(x.nova)?`<small>Nova medição: ${esc(fmt(+x.nova))} mg/dL${x.novaHora?" às "+esc(x.novaHora):""}</small>`:""}
        ${x.criadoPor?`<small>${nomeSpan(x.criadoPor,"Anotado por ")}</small>`:""}
      </button></li>`).join("")+`</ul>`;
    }
    h+=`<ul class="meals">`;
    MEALS.forEach((x,i)=>{
      const m=ms[i], filled=mealFilled(m), st=afterStatus(S.date,m), isNow=x.k===nowK&&!filled;
      let hint="";
      if(st)hint=`<span class="chip ${st.cls}">${st.txt}</span>`;
      else if(isNow)hint=`<span class="chip now">Agora</span>`;
      else if(filled&&has(m.antes)&&has(m.depois))hint=`<span class="chip done">Completo</span>`;
      const food=filled&&has(m.comeu)?` ${esc(m.comeu)}`:(filled?"":" Toque para registrar");
      h+=`<li><button class="meal${isNow?" now":""}" data-meal="${x.k}">
        <span class="meal-name">${x.n}</span>
        <span class="meal-hint">${hint}${food}</span>
        ${filled?(()=>{const it=[...(has(m.carbo)?[carboTxt(m)]:[]),...(m.local?[localNome(m.local)]:[]),...(m.tags||[])];
          return it.length||m.criadoPor?`<span class="meal-tags">${esc(it.join(" · "))}${nomeSpan(m.criadoPor,it.length?" · por ":"por ")}</span>`:""})():""}
        ${filled?`<span class="readings">${rd("a",m.antes,m.antesHora?"antes "+m.antesHora:"antes")}${rd("i",m.insulina,"un",1)}${rd("d",m.depois,m.depoisHora?"2h "+m.depoisHora:"2h")}</span>`:`<span class="addlabel">+ Registrar</span>`}
      </button></li>`;
    });
    h+=`</ul>`;
    const xs=extrasOf(iso);
    h+=`<div class="section-head"><h3>Outras medições</h3><button class="btn small" id="add-extra">+ Medição extra</button></div>`;
    h+=xs.length?`<ul class="extras">`+xs.map(x=>`<li><button class="extra-card" data-extra="${esc(x.id)}">
        <span class="top-line"><strong>${esc(x.hora||"--:--")}${x.momento?" · "+esc(x.momento):""}</strong><span class="val">${esc(extraValor(x))}${x.lo||x.hi||!has(x.valor)?"":" <small>mg/dL</small>"}</span></span>
        ${has(x.obs)?`<small>${esc(x.obs)}</small>`:""}${x.criadoPor?`<small>${nomeSpan(x.criadoPor,"Anotado por ")}</small>`:""}</button></li>`).join("")+`</ul>`
      :`<p class="empty-line">Ao acordar, ao deitar, de madrugada ou quando precisar medir fora das refeições.</p>`;
    h+=sensorDiaCard(iso);
    h+=`<p class="note">Toque numa refeição para anotar. Metas de glicemia, doses de insulina e decisões de tratamento seguem as orientações da equipe médica.</p>`;
    return h;
  }

  function dayTable(iso){
    let rows="";
    MEALS.forEach(x=>{
      const m=mealOf(iso,x.k);if(!mealFilled(m))return;
      rows+=`<tr><td>${x.n}${m.refeicaoHora?`<span class="tagline">${esc(m.refeicaoHora)}</span>`:""}</td><td class="num">${has(m.antes)?fmt(+m.antes):"–"}${m.antesHora?`<span class="tagline">${esc(m.antesHora)}</span>`:""}</td><td class="num">${has(m.insulina)?fmt(+m.insulina,1):"–"}</td><td class="num">${has(m.depois)?fmt(+m.depois):"–"}${m.depoisHora?`<span class="tagline">${esc(m.depoisHora)}</span>`:""}</td><td class="food">${esc(m.comeu||"")}${has(m.carbo)?`<span class="tagline">${esc(carboTxt(m))}</span>`:""}${m.local?`<span class="tagline">Aplicação: ${esc(localNome(m.local))}</span>`:""}${(m.tags||[]).length?`<span class="tagline">${esc(m.tags.join(" · "))}</span>`:""}${has(m.obs)?`<em>Obs.: ${esc(m.obs)}</em>`:""}${m.criadoPor?`<span class="tagline">${nomeSpan(m.criadoPor,"por ")}</span>`:""}</td></tr>`;
    });
    let out=rows?`<div class="tablewrap"><table><thead><tr><th>Refeição</th><th class="num">Antes</th><th class="num">Insul.</th><th class="num">2h</th><th>O que comeu e bebeu</th></tr></thead><tbody>${rows}</tbody></table></div>`:"";
    const xs=extrasOf(iso);
    if(xs.length)out+=`<ul class="extras">`+xs.map(x=>`<li class="extra-card"><span class="top-line"><span>Medição extra <strong>${esc(x.hora||"")}</strong>${x.momento?" · "+esc(x.momento):""}</span><span class="val">${esc(extraValor(x))}</span></span>${has(x.obs)?`<small>${esc(x.obs)}</small>`:""}${x.criadoPor?`<small>${nomeSpan(x.criadoPor,"Anotado por ")}</small>`:""}</li>`).join("")+`</ul>`;
    const hs=hiposOf(iso);
    if(hs.length)out+=`<ul class="hipos">`+hs.map(x=>`<li class="hipo-card"><span class="top-line"><span><span class="tag-hypo">Hipoglicemia</span> <strong>${esc(x.hora||"")}</strong></span><span class="val">${esc(hipoValor(x))}</span></span>
      ${x.situacao?`<small>${esc(x.situacao)}</small>`:""}${(x.sintomas||[]).length?`<small>Sintomas: ${esc(x.sintomas.join(", "))}</small>`:""}
      ${has(x.tratamento)?`<small>Feito: ${esc(x.tratamento)}</small>`:""}${has(x.nova)?`<small>Nova medição: ${esc(fmt(+x.nova))} mg/dL${x.novaHora?" às "+esc(x.novaHora):""}</small>`:""}
      ${has(x.obs)?`<small>Obs.: ${esc(x.obs)}</small>`:""}${x.criadoPor?`<small>${nomeSpan(x.criadoPor,"Anotado por ")}</small>`:""}</li>`).join("")+`</ul>`;
    return out;
  }

  function daysWithData(){
    return [...S.days.keys()].filter(dayHas).sort().reverse();
  }

  function viewHistory(){
    const start=S.histWindow?addDays(todayIso(),-(S.histWindow-1)):"0000-00-00";
    const source=daysWithData().filter(iso=>iso>=start&&iso<=todayIso());
    const used=new Set();source.forEach(iso=>dayTags(iso).forEach(t=>used.add(t)));
    if(S.tagFilter&&!used.has(S.tagFilter))S.tagFilter=null;
    const all=source.filter(iso=>!S.tagFilter||dayTags(iso).includes(S.tagFilter));
    const pageSize=7,pages=Math.max(1,Math.ceil(all.length/pageSize));
    S.histPage=Math.min(Math.max(1,S.histPage),pages);
    const first=(S.histPage-1)*pageSize,current=all.slice(first,first+pageSize);
    let h=`<h2>Histórico</h2><p class="sub">${all.length?`${all.length} ${all.length===1?"dia":"dias"} com registro, do mais recente para o mais antigo.`:"Nada registrado ainda."}</p>`;
    h+=`<div class="seg" role="group" aria-label="Filtrar histórico por período">${[[0,"Todos"],[7,"Semana"],[30,"Mês"],[365,"Ano"]].map(([n,l])=>`<button data-hwindow="${n}" aria-pressed="${S.histWindow===n}">${l}</button>`).join("")}</div>`;
    if(used.size)h+=`<div class="seg" role="group" aria-label="Filtrar por etiqueta"><button data-tagf="" aria-pressed="${!S.tagFilter}">Todos os dias</button>${ETIQUETAS.filter(t=>used.has(t)).map(t=>`<button data-tagf="${esc(t)}" aria-pressed="${S.tagFilter===t}">${esc(t)}</button>`).join("")}</div>`;
    if(!all.length)return h+`<div class="empty-state">Não há registros que correspondam aos filtros escolhidos.</div>`;
    h+=`<div class="list">`;
    current.forEach(iso=>{
      const ms=MEALS.map(x=>mealOf(iso,x.k)).filter(Boolean);
      const a=avg(ms.filter(m=>has(m.antes)).map(m=>+m.antes)), d=avg(ms.filter(m=>has(m.depois)).map(m=>+m.depois));
      h+=`<section class="card"><div class="dayhead"><strong>${esc(shortDate(iso))}</strong><span class="unit num">antes ${fmt(a)} · 2h ${fmt(d)}</span></div>${dayTable(iso)}
        <button class="linkbtn" data-open="${iso}">Abrir este dia</button></section>`;
    });
    h+=`</div>`;
    if(pages>1)h+=`<nav class="actions" aria-label="Páginas do histórico" style="grid-template-columns:1fr auto 1fr"><button class="btn" data-hpage="${S.histPage-1}" ${S.histPage===1?"disabled":""}>Anterior</button><span class="note" style="align-self:center;text-align:center">Página ${S.histPage} de ${pages}</span><button class="btn" data-hpage="${S.histPage+1}" ${S.histPage===pages?"disabled":""}>Próxima</button></nav>`;
    return h;
  }

  function computeSummary(){
    const end=todayIso(), start=S.period?addDays(end,-(S.period-1)):"0000-00-00";
    const isos=daysWithData().filter(i=>i>=start&&i<=end);
    const rows=MEALS.map(x=>{
      const a=[],d=[],ins=[],diff=[],cb=[];
      isos.forEach(iso=>{const m=mealOf(iso,x.k);if(!m)return;
        if(has(m.antes))a.push(+m.antes); if(has(m.depois))d.push(+m.depois); if(has(m.insulina))ins.push(+m.insulina); if(has(m.carbo))cb.push(+m.carbo);
        if(has(m.antes)&&has(m.depois))diff.push(m.depois-m.antes);});
      return {x,na:a.length,nd:d.length,a:avg(a),d:avg(d),ins:avg(ins),diff:avg(diff),da:distrib(a),dd:distrib(d),carbo:avg(cb),nc:cb.length,
              amin:a.length?Math.min(...a):null,amax:a.length?Math.max(...a):null,dmin:d.length?Math.min(...d):null,dmax:d.length?Math.max(...d):null};
    });
    const allA=[],allD=[];
    isos.forEach(iso=>MEALS.forEach(x=>{const m=mealOf(iso,x.k);if(!m)return;if(has(m.antes))allA.push(+m.antes);if(has(m.depois))allD.push(+m.depois)}));
    const first=isos.length?isos[isos.length-1]:null, last=isos.length?isos[0]:null;
    const hipos=[];isos.slice().reverse().forEach(iso=>hiposOf(iso).forEach(x=>hipos.push(Object.assign({iso},x))));
    const extras=[];isos.slice().reverse().forEach(iso=>extrasOf(iso).forEach(x=>extras.push(Object.assign({iso},x))));
    const tags=ETIQUETAS.map(t=>{const a=[],d=[];let n=0;
      isos.forEach(iso=>MEALS.forEach(x=>{const m=mealOf(iso,x.k);if(!m||!(m.tags||[]).includes(t))return;n++;if(has(m.antes))a.push(+m.antes);if(has(m.depois))d.push(+m.depois)}));
      return {t,n,a:avg(a),d:avg(d)}}).filter(r=>r.n>0);
    const locais=LOCAIS.map(l=>{let n=0,ultimo=null;isos.forEach(iso=>MEALS.forEach(x=>{const m=mealOf(iso,x.k);if(m&&m.local===l.k){n++;if(!ultimo||iso>ultimo)ultimo=iso}}));return {l,n,ultimo}});
    const todas=[...allA,...allD], dp=desvio(todas), media=avg(todas);
    const cv=dp!=null&&media?dp/media*100:null;
    // Sensor no período: só leituras automáticas (tipo 0), como no AGP. Escaneamentos repetiriam momentos já cobertos.
    const sDias=[...S.sensor.keys()].filter(i=>i>=start&&i<=end&&pontosSensor(i).some(p=>p.tipo===0)).sort();
    const porHora=Array.from({length:24},()=>[]), sTodas=[];
    sDias.forEach(iso=>pontosSensor(iso).forEach(p=>{if(p.tipo!==0)return;porHora[Math.floor(p.min/60)].push(p.mg);sTodas.push(p.mg)}));
    const sDp=desvio(sTodas), sMedia=avg(sTodas);
    const coverageDays=S.period||(sDias.length?Math.round((parseIso(end)-parseIso(sDias[0]))/864e5)+1:0);
    const sensor=sDias.length?{dias:sDias,n:sTodas.length,media:sMedia,dp:sDp,cv:sDp!=null&&sMedia?sDp/sMedia*100:null,
      cobertura:sensorCoverage(sTodas.length,coverageDays),
      horas:porHora.map(v=>v.length?{n:v.length,p5:percentil(v,.05),p25:percentil(v,.25),med:percentil(v,.5),p75:percentil(v,.75),p95:percentil(v,.95)}:null)}:null;
    return {isos,rows,allA,allD,first,last,start,end,hipos,extras,tags,dp,cv,nTodas:todas.length,locais,sensor,nLocais:locais.reduce((s,x)=>s+x.n,0)};
  }

  function chart(rows){
    const W=340,H=210,L=34,R=6,T=14,B=28,pw=W-L-R,ph=H-T-B;
    const mx=Math.max(200,...rows.flatMap(r=>[r.a||0,r.d||0]));
    const top=Math.ceil(mx/50)*50, step=top>300?100:50;
    const y=v=>T+ph-(v/top)*ph, gw=pw/rows.length, bw=Math.min(18,gw*0.32);
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Média de glicemia antes e 2 horas depois, por refeição">`;
    for(let v=0;v<=top;v+=step)s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
    rows.forEach((r,i)=>{
      const cx=L+gw*i+gw/2;
      [[r.a,"ba",-bw-1,"antes",r.na],[r.d,"bd",1,"2h depois",r.nd]].forEach(([v,c,off,lab,n])=>{
        if(v==null)return;
        const tip=`${r.x.n} · ${lab}\nMédia ${fmt(v)} mg/dL (${n} ${n===1?"medição":"medições"})`;
        s+=`<rect class="hit" x="${cx+off-2}" y="${T}" width="${bw+4}" height="${ph}" data-tip="${esc(tip)}"/><rect class="${c} mark" x="${cx+off}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="3" pointer-events="none"/><text class="val" x="${cx+off+bw/2}" y="${y(v)-4}" text-anchor="middle">${Math.round(v)}</text>`;
      });
      s+=`<text class="lbl" x="${cx}" y="${H-10}" text-anchor="middle">${r.x.s}</text>`;
    });
    return s+`</svg>`;
  }

  /* Perfil por refeição: adaptação do AGP para medições de ponta de dedo.
     Sem leitura contínua não há curva por hora; o que dá para mostrar é o espalhamento em cada momento medido. */
  const MIN_CAIXA=4;   // abaixo disso, 25–75% não quer dizer muito: mostra só mínimo–máximo e mediana
  function perfilChart(rows){
    const W=340,H=220,L=34,R=6,T=12,B=28,pw=W-L-R,ph=H-T-B;
    const vals=rows.flatMap(r=>[r.da,r.dd].filter(Boolean).flatMap(d=>[d.min,d.max]));
    const lo=Math.max(0,Math.floor((Math.min(...vals)-10)/50)*50), hi=Math.max(lo+100,Math.ceil((Math.max(...vals)+10)/50)*50), step=hi-lo>250?100:50;
    const y=v=>T+ph-(v-lo)/(hi-lo)*ph, gw=pw/rows.length;
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribuição da glicemia antes e 2 horas depois, por refeição: mínimo, máximo, metade central e mediana">`;
    for(let v=lo;v<=hi;v+=step)s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
    rows.forEach((r,i)=>{
      const cx=L+gw*i+gw/2;
      [[r.da,"a",-8,"antes"],[r.dd,"d",8,"2h depois"]].forEach(([d,c,off,lab])=>{
        if(!d)return;const x=cx+off;
        const tip=`${r.x.n} · ${lab} (${d.n} ${d.n===1?"medição":"medições"})\nMediana ${fmt(d.med)} mg/dL`+(d.n>=MIN_CAIXA?`\nMetade central: ${fmt(d.p25)} a ${fmt(d.p75)}`:"")+`\nMenor e maior: ${fmt(d.min)} a ${fmt(d.max)}`;
        s+=`<rect class="hit" x="${x-7}" y="${T}" width="14" height="${ph}" data-tip="${esc(tip)}"/>`;
        s+=`<line class="w${c}" x1="${x}" x2="${x}" y1="${y(d.max)}" y2="${y(d.min)}" stroke-width="2" stroke-linecap="round" pointer-events="none"/>`;
        if(d.n>=MIN_CAIXA)s+=`<rect class="b${c}" x="${x-4}" y="${y(d.p75)}" width="8" height="${Math.max(2,y(d.p25)-y(d.p75))}" rx="3" pointer-events="none"/>`;
        s+=`<circle class="b${c} med" cx="${x}" cy="${y(d.med)}" r="4.5" pointer-events="none"/>`;
      });
      s+=`<text class="lbl" x="${cx}" y="${H-10}" text-anchor="middle">${r.x.s}</text>`;
    });
    return s+`</svg>`;
  }

  function csv(){
    const q=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    const n=(v,d)=>has(v)?Number(v).toLocaleString("pt-BR",{maximumFractionDigits:d||0,useGrouping:false}):"";
    const lines=[["Data","Refeição","Glicemia antes (mg/dL)","Insulina (unidades)","O que comeu e bebeu","Glicemia 2h depois (mg/dL)","Observações","Horário antes","Horário da refeição/insulina","Horário 2h depois","Carboidratos (g)","Local da aplicação","Etiquetas"].join(";")];
    daysWithData().reverse().forEach(iso=>MEALS.forEach(x=>{const m=mealOf(iso,x.k);if(!mealFilled(m))return;
      lines.push([fmtDM.format(parseIso(iso)),x.n,n(m.antes),n(m.insulina,1),m.comeu,n(m.depois),m.obs,m.antesHora,m.refeicaoHora,m.depoisHora,n(m.carbo,1),localNome(m.local),(m.tags||[]).join(", ")].map(q).join(";"));}));
    daysWithData().reverse().forEach(iso=>extrasOf(iso).forEach(x=>{
      lines.push([fmtDM.format(parseIso(iso)),"Medição extra ("+[x.hora,x.momento].filter(Boolean).join(" - ")+")",x.lo?"LO":x.hi?"HI":n(x.valor),"","","",x.obs||"",x.hora||"","","","","",""].map(q).join(";"));}));
    daysWithData().reverse().forEach(iso=>hiposOf(iso).forEach(x=>{
      const det=[x.situacao&&"Situação: "+x.situacao,(x.sintomas||[]).length&&"Sintomas: "+x.sintomas.join(", "),has(x.tratamento)&&"Feito: "+x.tratamento,
        has(x.nova)&&"Nova medição: "+n(x.nova)+" mg/dL"+(x.novaHora?" às "+x.novaHora:""),has(x.obs)&&x.obs].filter(Boolean).join(" | ");
      lines.push([fmtDM.format(parseIso(iso)),"Hipoglicemia ("+(x.hora||"")+")",x.lo?"LO":n(x.valor),"","","",det,x.hora||"","","","","",""].map(q).join(";"));}));
    return "﻿"+lines.join("\r\n");

  /* ---------- cópia de segurança ---------- */
  // Um arquivo .json com tudo o que o site guarda: dias, leituras do sensor, nome e plano da equipe médica.
  // Serve para não depender de uma única conta: o arquivo fica com a família.
  const BACKUP_FORMATO="diario-glicemia-backup";
  /* ---------- sensor (FreeStyle Libre, CSV do LibreView) ---------- */
  // Cada dia do sensor é um documento sensor/AAAA-MM-DD com três listas paralelas (minuto do dia, mg/dL, tipo),
  // porque o banco não guarda listas dentro de listas. tipo 0 = leitura automática (15 em 15 min), 1 = escaneamento.
  function lerCsvTexto(t){
    t=t.replace(/^\uFEFF/,"");
    const amostra=t.split(/\r?\n/).slice(0,4).join("\n");
    const sep=[",",";","\t"].map(c=>[c,amostra.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
    const rows=[];let row=[],cell="",q=false;
    for(let i=0;i<t.length;i++){const c=t[i];
      if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
      else if(c==='"')q=true;
      else if(c===sep){row.push(cell);cell=""}
      else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
      else cell+=c;
    }
    if(cell||row.length){row.push(cell);rows.push(row)}
    return rows;
  }
  const NAO_LIBRE="Este arquivo não parece ser a exportação de glicose do LibreView (arquivo .csv).";
  function lerLibreView(texto){
    const rows=lerCsvTexto(texto);
    // A coluna "tipo de registro" é a referência: as outras vêm em posição fixa em relação a ela (padrão do LibreView).
    let iTipo=-1,cab=null;
    for(let i=0;i<Math.min(rows.length,6)&&iTipo<0;i++){
      const j=rows[i].findIndex(c=>/record type|tipo de regist|tipo de reg/i.test(c));
      if(j>=0){iTipo=j;cab=rows[i]}
    }
    if(iTipo<0)iTipo=3;                                  // sem cabeçalho reconhecível: posição padrão
    const iData=iTipo-1,iHist=iTipo+1,iScan=iTipo+2;
    const mmol=cab?/mmol/i.test(cab[iHist]||""):false;
    const RE=/^\s*(\d{1,4})[-\/.](\d{1,2})[-\/.](\d{1,4})[ T]+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp])?\.?\s*[Mm]?\.?\s*$/;
    const brutos=[];
    rows.forEach(r=>{
      const tipo=(r[iTipo]||"").trim();if(tipo!=="0"&&tipo!=="1")return;
      const m=RE.exec(r[iData]||"");if(!m)return;
      let v=parseFloat(String(r[tipo==="0"?iHist:iScan]||"").trim().replace(",","."));
      if(!isFinite(v))return;
      if(mmol)v=v*18.016;
      v=Math.round(v);if(v<20||v>600)return;
      brutos.push({m,tipo:+tipo,v});
    });
    if(!brutos.length)throw NAO_LIBRE;
    // Ordem da data: ano primeiro é inequívoco; senão, um número acima de 12 decide; na dúvida, dia/mês (padrão no Brasil).
    let ordem="DMY",ambigua=false;
    if(brutos[0].m[1].length===4)ordem="YMD";
    else if(brutos.some(b=>+b.m[1]>12))ordem="DMY";
    else if(brutos.some(b=>+b.m[2]>12))ordem="MDY";
    else ambigua=true;
    const dias=new Map();
    brutos.forEach(({m,tipo,v})=>{
      const [a,b,c]=[+m[1],+m[2],+m[3]];
      const [y,mo,d]=ordem==="YMD"?[a,b,c]:ordem==="MDY"?[c,a,b]:[c,b,a];
      let h=+m[4];const ap=(m[6]||"").toLowerCase();
      if(ap==="p"&&h<12)h+=12;if(ap==="a"&&h===12)h=0;
      if(mo<1||mo>12||d<1||d>31||h>23)return;
      const iso=`${y}-${pad(mo)}-${pad(d)}`, min=h*60+ +m[5];
      if(!dias.has(iso))dias.set(iso,new Map());
      dias.get(iso).set(min*10+tipo,{min,mg:v,tipo});   // mesma leitura repetida no arquivo conta uma vez
    });
    const isos=[...dias.keys()].sort();
    return {dias,isos,n:[...dias.values()].reduce((s,x)=>s+x.size,0),ordem,ambigua,mmol};
  }
  // Junta leituras novas com as que já existem no dia (a mesma leitura é substituída, nunca duplicada).
  function juntarSensor(atual,novos){
    return mergeSensor(atual,novos);
  }
  function pontosSensor(iso){
    const d=S.sensor.get(iso);if(!d||!(d.min||[]).length)return [];
    return d.min.map((min,i)=>({min,mg:d.mg[i],tipo:(d.tipo||[])[i]||0}));
  }
  const hm=min=>pad(Math.floor(min/60))+":"+pad(min%60);
  // Curva do dia: leituras automáticas como linha (quebrada onde falta mais de 45 min), escaneamentos como pontos.
  function curvaDia(pts,iso){
    const W=340,H=160,L=34,R=6,T=16,B=22,pw=W-L-R,ph=H-T-B;
    const vs=pts.map(p=>p.mg), lo=Math.max(0,Math.floor((Math.min(...vs)-10)/50)*50), hi=Math.max(lo+100,Math.ceil((Math.max(...vs)+10)/50)*50), step=hi-lo>250?100:50;
    const x=m=>L+m/1440*pw, y=v=>T+ph-(v-lo)/(hi-lo)*ph;
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Glicose do sensor ao longo do dia">`;
    for(let v=lo;v<=hi;v+=step)s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
    [0,6,12,18,24].forEach(h=>s+=`<text class="axis" x="${x(h*60)}" y="${H-6}" text-anchor="${h===0?"start":h===24?"end":"middle"}">${h}h</text>`);
    hiposOf(iso).forEach(h=>{const m=/^(\d{1,2}):(\d{2})/.exec(h.hora||"");if(!m)return;const mx=x(+m[1]*60+ +m[2]);
      s+=`<line class="mk" x1="${mx}" x2="${mx}" y1="${T}" y2="${T+ph}" stroke-dasharray="3 3"/><text class="mkt" x="${mx}" y="${T-4}" text-anchor="middle">hipo</text>`});
    const auto=pts.filter(p=>p.tipo===0);let dpath="";
    auto.forEach((p,i)=>{dpath+=(i&&p.min-auto[i-1].min<=45?"L":"M")+x(p.min).toFixed(1)+" "+y(p.mg).toFixed(1)});
    if(dpath)s+=`<path class="curva" d="${dpath}"/>`;
    pts.filter(p=>p.tipo===1).forEach(p=>s+=`<circle class="scan" cx="${x(p.min)}" cy="${y(p.mg)}" r="4"/>`);
    // área de toque: uma faixa por leitura, até a metade do caminho para a vizinha
    pts.forEach((p,i)=>{const a=i?(p.min+pts[i-1].min)/2:0,b=i<pts.length-1?(p.min+pts[i+1].min)/2:1440;
      s+=`<rect class="hit" x="${x(a)}" y="${T}" width="${Math.max(1,x(b)-x(a))}" height="${ph}" data-tip="${hm(p.min)} · ${p.mg} mg/dL${p.tipo===1?" (escaneamento)":""}"/>`});
    return s+`</svg>`;
  }
  function sensorDiaCard(iso){
    const pts=pontosSensor(iso);if(!pts.length)return "";
    const vs=pts.map(p=>p.mg);
    return `<section class="card" style="margin-top:12px"><div class="dayhead"><strong>Sensor</strong><span class="unit num">${pts.length} ${pts.length===1?"leitura":"leituras"}</span></div>
      <div class="daystrip" style="grid-template-columns:repeat(3,1fr);margin:0 0 8px">
        <div><b>${fmt(avg(vs))}</b><small>média</small></div><div><b>${fmt(Math.min(...vs))}</b><small>menor</small></div><div><b>${fmt(Math.max(...vs))}</b><small>maior</small></div></div>
      ${curvaDia(pts,iso)}
      <p class="note" style="margin-top:4px">Linha: leituras automáticas. Pontos: escaneamentos. Toque na curva para ver o horário e o valor.</p></section>`;
  }
  /* AGP (Ambulatory Glucose Profile) com as leituras do sensor: todos os dias do período sobrepostos, hora a hora.
     Faixa clara: 5% a 95% das leituras; faixa escura: 25% a 75%; linha: mediana. */
  const MIN_HORA=5;   // hora com menos leituras que isso fica de fora das faixas
  function agpChart(horas){
    const W=340,H=210,L=34,R=6,T=10,B=22,pw=W-L-R,ph=H-T-B;
    const ok=horas.map((h,i)=>h&&h.n>=MIN_HORA?Object.assign({i},h):null).filter(Boolean);
    const lo=Math.max(0,Math.floor((Math.min(...ok.map(h=>h.p5))-10)/50)*50), hi=Math.max(lo+100,Math.ceil((Math.max(...ok.map(h=>h.p95))+10)/50)*50), step=hi-lo>250?100:50;
    const x=i=>L+(i+.5)/24*pw, y=v=>T+ph-(v-lo)/(hi-lo)*ph;
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil do sensor por hora do dia: mediana e faixas de 25 a 75% e de 5 a 95%">`;
    for(let v=lo;v<=hi;v+=step)s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
    [0,6,12,18,24].forEach(h=>s+=`<text class="axis" x="${L+h/24*pw}" y="${H-6}" text-anchor="${h===0?"start":h===24?"end":"middle"}">${h}h</text>`);
    // horas seguidas com dados formam um trecho; um buraco interrompe as faixas e a linha
    const trechos=[];ok.forEach(h=>{const t=trechos[trechos.length-1];if(t&&t[t.length-1].i===h.i-1)t.push(h);else trechos.push([h])});
    const area=(t,a,b)=>"M"+t.map(h=>x(h.i).toFixed(1)+" "+y(h[a]).toFixed(1)).join("L")+"L"+t.slice().reverse().map(h=>x(h.i).toFixed(1)+" "+y(h[b]).toFixed(1)).join("L")+"Z";
    trechos.forEach(t=>{
      if(t.length===1){const h=t[0];s+=`<rect class="f90" x="${x(h.i)-3}" y="${y(h.p95)}" width="6" height="${y(h.p5)-y(h.p95)}"/><rect class="f50" x="${x(h.i)-3}" y="${y(h.p75)}" width="6" height="${y(h.p25)-y(h.p75)}"/>`;return}
      s+=`<path class="f90" d="${area(t,"p95","p5")}"/><path class="f50" d="${area(t,"p75","p25")}"/><path class="curva" d="M${t.map(h=>x(h.i).toFixed(1)+" "+y(h.med).toFixed(1)).join("L")}"/>`;
    });
    ok.forEach(h=>s+=`<rect class="hit" x="${L+h.i/24*pw}" y="${T}" width="${pw/24}" height="${ph}" data-tip="${pad(h.i)}h–${pad(h.i+1)}h (${h.n} leituras)\nMediana ${fmt(h.med)} mg/dL\nMetade central: ${fmt(h.p25)} a ${fmt(h.p75)}\n90% das leituras: ${fmt(h.p5)} a ${fmt(h.p95)}"/>`);
    return s+`</svg>`;
  }
  function agpCard(R){
    const Sn=R.sensor;if(!Sn||!Sn.horas.some(h=>h&&h.n>=MIN_HORA))return "";
    const dm=iso=>fmtDM.format(parseIso(iso)).slice(0,5);
    return `<section class="card" style="margin-top:12px"><strong>Perfil do sensor (AGP)</strong>
      <p class="note" style="margin-top:4px">${Sn.dias.length} ${Sn.dias.length===1?"dia":"dias"} de sensor (${dm(Sn.dias[0])} a ${dm(Sn.dias[Sn.dias.length-1])}) sobrepostos, hora a hora.${Sn.dias.length<14?" O relatório AGP costuma usar 14 dias.":""}</p>
      <div class="stats" style="margin:10px 0 4px">
        <div class="stat"><b>${fmt(Sn.media)}</b><small>média do sensor (mg/dL)</small></div>
        <div class="stat"><b>${Sn.cv==null?"–":fmt(Sn.cv)+"%"}</b><small>coeficiente de variação</small></div>
        <div class="stat"><b>${fmt(Math.min(100,Sn.cobertura))}%</b><small>do tempo com leitura</small></div>
        <div class="stat"><b>${fmt(Sn.n)}</b><small>leituras automáticas</small></div></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Mediana</span><span><i style="background:var(--accent);opacity:var(--f50)"></i>25–75%</span><span><i style="background:var(--accent);opacity:var(--f90)"></i>5–95%</span></div>
      ${agpChart(Sn.horas)}
      <p class="note" style="margin-top:4px">Em cada hora: a linha é a mediana, a faixa escura reúne a metade central das leituras e a clara, 90% delas. Horas com menos de ${MIN_HORA} leituras ficam de fora.</p>
      <details class="tabela"><summary>Ver em tabela</summary><div class="tablewrap"><table><thead><tr><th>Hora</th><th class="num">Mediana</th><th class="num">25–75%</th><th class="num">5–95%</th><th class="num">Leituras</th></tr></thead><tbody>
        ${Sn.horas.map((h,i)=>`<tr><td>${pad(i)}h</td>${h&&h.n>=MIN_HORA?`<td class="num">${fmt(h.med)}</td><td class="num">${fmt(h.p25)}–${fmt(h.p75)}</td><td class="num">${fmt(h.p5)}–${fmt(h.p95)}</td>`:`<td class="num">–</td><td class="num">–</td><td class="num">–</td>`}<td class="num">${h?h.n:0}</td></tr>`).join("")}
      </tbody></table></div></details></section>`;
  }
  function sensorCard(){

          <li>Datas lidas como ${P.ordem==="MDY"?"mês/dia/ano":P.ordem==="YMD"?"ano-mês-dia":"dia/mês/ano"}${P.ambigua?" (o arquivo não deixa claro; confira se as datas acima estão certas)":""}.</li>

        <div><button type="button" class="btn" id="lv-cancel">Cancelar</button><button type="button" class="btn primary" id="lv-import">Importar</button></div></div>`:""}

  }
  function setImpMsg(msg){S.imp.msg=msg;const el=$("lv-msg");if(el){el.textContent=msg||"";el.hidden=!msg}}
  async function importarSensor(){
    const I=S.imp,P=I.plano;if(!P||I.busy)return;

    let feitos=0;

        const iso=P.isos[i];setImpMsg(`Importando: dia ${i+1} de ${P.isos.length}…`);
        const doc=Object.assign({data:iso,fonte:"LibreView",atualizadoEm:Date.now()},juntarSensor(S.sensor.get(iso),P.dias.get(iso)));
        if(S.uid)doc.importadoPor=S.uid;
        if(S.mode==="db"){
          const ref=S.db.doc("sensor/"+iso),chave="sensor/"+iso;
          const job=(queues[chave]||Promise.resolve()).catch(()=>{}).then(()=>ref.set(doc));queues[chave]=job;
          try{await job}catch(e){if(e&&e.code==="invalid_argument"){S.readOnly=true;throw "Sem permissão para salvar. A importação parou."}throw e}
        }
        S.sensor.set(iso,doc);feitos++;
      }
      if(S.mode!=="db"&&!saveSensorLocal())throw "Não há espaço neste navegador para guardar as leituras do sensor.";

    }catch(err){setImpMsg(typeof err==="string"?err:`A importação parou por um erro depois de ${feitos} ${feitos===1?"dia":"dias"}. Tente de novo: o que já entrou não se repete.`)}
    finally{I.busy=false;render()}
  }

  function backupCard(){
    const B=S.backup, n=daysWithData().length+[...S.sensor.keys()].filter(k=>!dayHas(k)).length, ro=S.readOnly||S.mode==="offline"||S.mode==="loading";
    return `<section class="card" style="margin-top:12px"><strong>Cópia de segurança</strong>
      <p class="note" style="margin-top:6px">Baixa um arquivo com todos os registros${n?` (${n} ${n===1?"dia":"dias"})`:""}, o nome e o plano da equipe médica. Guarde fora do celular, por exemplo no e-mail ou no Google Drive.</p>
      <div class="actions"><button class="btn" id="bk-export"${B.busy||!n?" disabled":""}>Baixar cópia de segurança</button>
      ${ro||B.busy||B.plano?"":`<label class="btn filebtn">Restaurar de uma cópia<input type="file" id="bk-file" accept=".json,application/json"></label>`}</div>
      ${B.plano?planoHtml(B.plano):""}
      <p class="note" id="bk-msg" role="status"${B.msg?"":" hidden"}>${esc(B.msg||"")}</p>
      <details style="margin-top:18px" ${S.eraseConfirm||S.erasing?"open":""}><summary>Privacidade e exclusão dos dados</summary>
        ${S.mode==="db"
          ?(S.backend==="supabase"
            ?`<p class="note">Os registros ficam no banco de dados deste diário, e só as pessoas convidadas por e-mail, depois de entrar com a conta Google, conseguem vê-los. Apagar tudo remove os registros, o sensor, o nome e o plano para todos, em todos os aparelhos; as pessoas com acesso continuam. Faça uma cópia antes.</p>`
            :`<p class="note">Os registros ficam guardados no Claude, na conta de quem criou este diário, e só as pessoas com quem ele foi compartilhado conseguem vê-los. Apagar tudo remove os dados para todos os cuidadores, em todos os aparelhos. Faça uma cópia antes.</p>`)
          :`<p class="note">Neste aparelho, os registros ficam no armazenamento do navegador sem uma senha própria. Use um aparelho protegido por senha. Para remover tudo deste diário, faça uma cópia antes.</p>`}
        ${S.mode==="db"&&!S.isOwner?`<p class="note">Só quem criou o diário pode apagar todos os dados.</p>`:S.eraseConfirm?`<div class="confirm" role="alert"><strong>Esta ação não pode ser desfeita.</strong><span>Ela apaga registros, leituras do sensor, nome e plano da equipe médica deste diário. Digite APAGAR para confirmar.</span><input class="in" id="erase-word" autocomplete="off" aria-label="Digite APAGAR para confirmar"><div><button type="button" class="btn" id="erase-cancel">Cancelar</button><button type="button" class="btn danger" id="erase-confirm" disabled>${S.erasing?"Apagando…":"Apagar todos os dados"}</button></div></div>`:
        `<button type="button" class="btn danger" id="erase-start" ${ro?"disabled":""}>Apagar todos os dados deste diário</button>`}
      </details></section>`;
  }
  function setBackupMsg(msg){S.backup.msg=msg;const el=$("bk-msg");if(el){el.textContent=msg||"";el.hidden=!msg}}
  async function exportBackup(){
    const B=S.backup;if(B.busy)return;
    const dl=await getDownloads();if(!dl)return;
    B.busy=true;renderView();
    try{
      const dias={};daysWithData().forEach(iso=>{dias[iso]=S.days.get(iso)});
      const sensor={};S.sensor.forEach((d,iso)=>{if((d.min||[]).length)sensor[iso]=d});
      const copia={formato:BACKUP_FORMATO,versao:1,exportadoEm:new Date().toISOString(),nome:S.nome||"",plano:S.plano||"",dias,sensor};
      setBackupMsg("Preparando o arquivo…");
      await dl.save({filename:`copia-glicemia-${todayIso()}.json`,data:new Blob([JSON.stringify(copia)],{type:"application/json"})});
      const nd=Object.keys(dias).length, ns=Object.keys(sensor).length;
      setBackupMsg(`Cópia baixada: ${nd} ${nd===1?"dia":"dias"}${ns?`, ${ns} ${ns===1?"dia":"dias"} de sensor`:""}.`);
    }catch(err){
      const c=err&&err.code;
      if(c==="declined")setBackupMsg(null);
      else if(c==="too_large")setBackupMsg("O arquivo ficou grande demais para esta tela.");
      else if(["unavailable","not_granted","capability_disabled","capability_removed","extension_not_enabled"].includes(c)){S.dlMsg=DL_MSG;setBackupMsg(null)}
      else setBackupMsg("Não foi possível baixar a cópia agora. Tente de novo.");
    }finally{B.busy=false;renderView()}
  }

  // Restauração: junta cada registro da cópia com o que já existe.
  const COPIA_INVALIDA="Este arquivo não é uma cópia de segurança do diário.";
  function lerCopia(texto){
    let c;try{c=JSON.parse(texto)}catch(e){throw COPIA_INVALIDA}
    if(!c||c.formato!==BACKUP_FORMATO||!c.dias||typeof c.dias!=="object")throw COPIA_INVALIDA;
    if(c.versao!==1)throw "Esta cópia foi feita por uma versão mais nova do site. Atualize a página e tente de novo.";
    const dias={};
    // O arquivo vem de fora: só entram chaves de data válidas e dias em forma de objeto.
    // Cópias antigas podem trazer "fotos" (o site já guardou fotos dos pratos); elas são ignoradas.
    for(const [iso,d] of Object.entries(c.dias)){
      if(!validIsoDate(iso)||!validBackupDay(d))throw COPIA_INVALIDA;
      dias[iso]=d;
    }
    const sensor={};
    for(const [iso,d] of Object.entries(c.sensor&&typeof c.sensor==="object"?c.sensor:{})){
      if(!validIsoDate(iso)||!d||!Array.isArray(d.min)||!Array.isArray(d.mg)||d.min.length!==d.mg.length)throw COPIA_INVALIDA;
      const num=a=>Array.isArray(a)&&a.every(v=>typeof v==="number"&&isFinite(v));
      if(!num(d.min)||!num(d.mg)||(d.tipo&&(!num(d.tipo)||d.tipo.length!==d.min.length))||d.min.some(v=>v<0||v>=1440)||d.mg.some(v=>v<0))throw COPIA_INVALIDA;
      const m=new Map();d.min.forEach((min,i)=>{const tipo=d.tipo?d.tipo[i]:0;m.set(min*10+tipo,{min,mg:d.mg[i],tipo})});
      sensor[iso]=m;
    }
    return {exportadoEm:c.exportadoEm,nome:typeof c.nome==="string"?c.nome:"",plano:typeof c.plano==="string"?c.plano:"",dias,sensor};
  }
  function planejarRestauracao(c){
    const novos=[],trocar=[],manter=[];
    Object.keys(c.dias).sort().forEach(iso=>{
      if(!dayHas(iso))novos.push(iso);
      else {
        const atual=S.days.get(iso),mesclado=mergeDayRecords(atual,c.dias[iso]);
        if(JSON.stringify(mesclado)!==JSON.stringify(atual))trocar.push(iso);else manter.push(iso);
      }
    });
    // Sensor: entra o dia em que a cópia acrescenta alguma leitura (juntar nunca apaga).
    const sensor=Object.keys(c.sensor).sort().filter(iso=>{const a=S.sensor.get(iso);return juntarSensor(a,c.sensor[iso]).min.length>((a&&a.min)||[]).length});
    return {c,novos,trocar,manter,sensor};
  }
  function planoHtml(P){
    const q=n=>n===1?"1 dia":n+" dias", quando=P.c.exportadoEm&&!isNaN(new Date(P.c.exportadoEm))?" de "+fmtDM.format(new Date(P.c.exportadoEm)):"";
    const nada=!P.novos.length&&!P.trocar.length&&!P.sensor.length;
    return `<div class="confirm"><strong>Cópia${esc(quando)}: ${q(Object.keys(P.c.dias).length)}</strong>
      ${nada?`<span>Nada a restaurar: tudo o que está na cópia já está aqui.</span>`:`<ul class="restore-plan">
        ${P.novos.length?`<li>${q(P.novos.length)} que não ${P.novos.length===1?"existe":"existem"} aqui ${P.novos.length===1?"será adicionado":"serão adicionados"}.</li>`:""}
        ${P.trocar.length?`<li>${q(P.trocar.length)} ${P.trocar.length===1?"receberá":"receberão"} registros da cópia sem apagar as outras anotações.</li>`:""}
        ${P.manter.length?`<li>${q(P.manter.length)} ${P.manter.length===1?"fica":"ficam"} como ${P.manter.length===1?"está":"estão"}, porque a versão daqui é igual ou mais recente.</li>`:""}
        ${P.sensor.length?`<li>${q(P.sensor.length)} de sensor ${P.sensor.length===1?"recebe":"recebem"} leituras da cópia (nada é apagado).</li>`:""}</ul>`}
      <div>${nada?`<button type="button" class="btn" id="bk-cancel" style="grid-column:1 / -1">Fechar</button>`
        :`<button type="button" class="btn" id="bk-cancel">Cancelar</button><button type="button" class="btn primary" id="bk-restore">Restaurar</button>`}</div></div>`;
  }
  async function restaurar(){
    const B=S.backup, P=B.plano;if(!P||B.busy)return;
    B.busy=true;B.plano=null;renderView();
    const alvo=[...P.novos,...P.trocar];let falhas=0;
    try{
      for(let i=0;i<alvo.length;i++){
        const iso=alvo[i];setBackupMsg(`Restaurando os dias: ${i+1} de ${alvo.length}…`);
        const vindo=JSON.parse(JSON.stringify(P.c.dias[iso]));vindo.data=iso;
        // Refeições de cópias antigas podem apontar para fotos que o site não guarda mais.
        Object.values(vindo.refeicoes||{}).forEach(m=>{if(m)delete m.fotos});
        const d=mergeDayRecords(S.days.get(iso),vindo);
        if(S.mode==="db"){
          const ref=S.db.doc("dias/"+iso);
          const job=(queues[iso]||Promise.resolve()).catch(()=>{}).then(()=>ref.set(d));queues[iso]=job;
          try{await job;S.days.set(iso,d)}
          catch(e){if(e&&e.code==="invalid_argument"){S.readOnly=true;throw "Sem permissão para salvar. A restauração parou."}falhas++}
        }else S.days.set(iso,d);
      }
      for(let i=0;i<P.sensor.length;i++){
        const iso=P.sensor[i];setBackupMsg(`Restaurando o sensor: dia ${i+1} de ${P.sensor.length}…`);
        const doc=Object.assign({},S.sensor.get(iso)||{data:iso,fonte:"LibreView"},juntarSensor(S.sensor.get(iso),P.c.sensor[iso]),{atualizadoEm:Date.now()});
        if(S.mode==="db"){const ref=S.db.doc("sensor/"+iso),chave="sensor/"+iso;
          const job=(queues[chave]||Promise.resolve()).catch(()=>{}).then(()=>ref.set(doc));queues[chave]=job;
          try{await job}catch(e){if(e&&e.code==="invalid_argument"){S.readOnly=true;throw "Sem permissão para salvar. A restauração parou."}falhas++;continue}}
        S.sensor.set(iso,doc);
      }
      if(S.mode!=="db"&&P.sensor.length&&!saveSensorLocal())throw "Não há espaço neste navegador para restaurar o sensor.";
      if(S.mode!=="db"&&!saveLocal())throw "Não há espaço neste navegador para restaurar a cópia.";
      if(!S.nome&&P.c.nome){S.nome=P.c.nome;await saveNome(P.c.nome).catch(()=>{})}
      if(!S.plano&&P.c.plano){S.plano=P.c.plano;await savePlano(P.c.plano).catch(()=>{})}
      const feitos=alvo.length+P.sensor.length-falhas;
      setBackupMsg(`Cópia restaurada: ${feitos} ${feitos===1?"dia":"dias"}${P.sensor.length?` (${P.sensor.length} de sensor)`:""}.`+(falhas?` ${falhas} não ${falhas===1?"pôde":"puderam"} ser salvos; tente restaurar de novo.`:""));
    }catch(err){setBackupMsg(typeof err==="string"?err:"A restauração parou por um erro. Os dias já restaurados foram mantidos; tente de novo.")}
    finally{B.busy=false;render()}
  }

  async function eraseAllData(){
    // No diário compartilhado, só o dono apaga tudo: um cuidador com permissão de edição (escola, avó) não pode sumir com o histórico da família.
    if(S.erasing||(S.mode==="db"&&!S.isOwner))return;S.erasing=true;renderView();setSync("saving","Apagando dados…");
    try{
      await Promise.allSettled(Object.values(queues));
      if(S.mode==="db"&&S.db.apagarTudo)await S.db.apagarTudo();
      else if(S.mode==="db"){
        for(const iso of S.days.keys())await S.db.doc("dias/"+iso).delete();
        for(const iso of S.sensor.keys())await S.db.doc("sensor/"+iso).delete();
        await S.db.doc("config/crianca").delete();
        await S.db.doc("config/plano").delete();
      }
      [LOCAL_KEY,LOCAL_KEY+"-sensor",LOCAL_KEY+"-nome",LOCAL_KEY+"-plano"].forEach(k=>localStorage.removeItem(k));
      S.days=new Map();S.sensor=new Map();S.nome="";S.plano="";S.eraseConfirm=false;S.erasing=false;
      setSync("saved","Todos os dados foram apagados");render();toast("Dados apagados");
    }catch(e){
      S.erasing=false;setSync("error","Não foi possível apagar tudo");renderView();
      toast("A exclusão não terminou. Tente novamente.");
    }
  }

    // indicadores

      doc.setFillColor(...C.after);doc.rect(x+15,yy-2.2,2.5,2.5,"F");doc.text("2h depois",x+18.5,yy)};
    const axis=(x,yy,w,h,lo,hi)=>{const step=(hi-lo)>250?100:50;doc.setLineWidth(0.2);doc.setDrawColor(...C.line);doc.setFontSize(6.5);doc.setTextColor(...C.muted);doc.setFont("helvetica","normal");
      for(let v=lo;v<=hi;v+=step){const py=yy+h-(v-lo)/(hi-lo)*h;doc.line(x,py,x+w,py);doc.text(String(v),x-1.5,py+1,{align:"right"})}};
    let y=63;

    // Sem refeições no período (família que só usa o sensor), as seções de refeição são puladas.
    if(R.isos.length){
    // tabela por refeição
    doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...C.ink);doc.text("Médias por refeição",M,63);
    table(doc,{startY:66,margin:{left:M,right:M},theme:"grid",
      head:[["Refeição","Antes\nmédia","Antes\nmín-máx","2h depois\nmédia","2h depois\nmín-máx","Variação\nmédia","Insulina\nmédia (un.)","Carbo\nmédia (g)","Medições\nantes/2h"]],
      body:R.rows.map(r=>[r.x.n,n0(r.a),r.na?n0(r.amin)+"-"+n0(r.amax):"-",n0(r.d),r.nd?n0(r.dmin)+"-"+n0(r.dmax):"-",
        r.diff==null?"-":(r.diff>0?"+":"")+n0(r.diff),n1(r.ins),n0(r.carbo),r.na+"/"+r.nd]),
      styles:{font:"helvetica",fontSize:8.5,cellPadding:1.8,lineColor:C.line,textColor:C.ink,halign:"center"},
      headStyles:{fillColor:C.accent,textColor:255,fontStyle:"bold",fontSize:7.5},

    y=doc.lastAutoTable.finalY+4;

    // barras por refeição

    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...C.ink);doc.text("Média por refeição",M,y);legend(M+gw-35,y);
    const bmax=Math.max(200,...R.rows.flatMap(r=>[r.a||0,r.d||0])),bhi=Math.ceil(bmax/50)*50;
    axis(x0,top,pw,ph,0,bhi);
    const g=pw/R.rows.length,bwid=Math.min(4.5,g*0.3);
    R.rows.forEach((r,i)=>{const cx=x0+g*i+g/2;
      [[r.a,C.accent,-bwid-0.3],[r.d,C.after,0.3]].forEach(([v,col,off])=>{if(v==null)return;
        const py=top+ph-v/bhi*ph;doc.setFillColor(...col);doc.rect(cx+off,py,bwid,top+ph-py,"F");
        doc.setFontSize(6);doc.setTextColor(...C.ink);doc.text(String(Math.round(v)),cx+off+bwid/2,py-1,{align:"center"})});
      doc.setFontSize(6.5);doc.setTextColor(...C.muted);doc.text(r.x.s,cx,top+ph+4,{align:"center"})});

    // evolução diária
    x0=M+gw+8+7;
    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...C.ink);doc.text("Evolução diária (média do dia)",M+gw+8,y);
    const days=[];for(let i=R.first;i<=R.last;i=addDays(i,1))days.push(i);
    const pts=days.map((iso,i)=>{const ms=MEALS.map(x=>mealOf(iso,x.k)).filter(Boolean);
      return {i,a:avg(ms.filter(m=>has(m.antes)).map(m=>+m.antes)),d:avg(ms.filter(m=>has(m.depois)).map(m=>+m.depois))}});
    const vals=pts.flatMap(p=>[p.a,p.d]).filter(v=>v!=null);
    if(!vals.length)vals.push(100);
    const lo=Math.max(0,Math.floor((Math.min(...vals)-10)/50)*50),hi=Math.max(lo+100,Math.ceil((Math.max(...vals)+10)/50)*50);
    axis(x0,top,pw,ph,lo,hi);
    const px=i=>x0+(days.length>1?i/(days.length-1)*pw:pw/2),py=v=>top+ph-(v-lo)/(hi-lo)*ph;
    [["a",C.accent],["d",C.after]].forEach(([k,col])=>{const ps=pts.filter(p=>p[k]!=null);
      doc.setDrawColor(...col);doc.setFillColor(...col);doc.setLineWidth(0.6);
      for(let j=1;j<ps.length;j++)doc.line(px(ps[j-1].i),py(ps[j-1][k]),px(ps[j].i),py(ps[j][k]));
      ps.forEach(p=>doc.circle(px(p.i),py(p[k]),0.8,"F"))});
    const nt=Math.min(days.length,5);doc.setFontSize(6.5);doc.setTextColor(...C.muted);doc.setFont("helvetica","normal");
    for(let t=0;t<nt;t++){const i=nt>1?Math.round(t*(days.length-1)/(nt-1)):0;const [,mm,dd]=days[i].split("-");doc.text(dd+"/"+mm,px(i),top+ph+4,{align:"center"})}

    y=top+ph+14;
    }

    // AGP do sensor
    const Sn=R.sensor, horasOk=Sn?Sn.horas.map((h,i)=>h&&h.n>=MIN_HORA?Object.assign({i},h):null).filter(Boolean):[];
    if(horasOk.length){
      if(y>205){doc.addPage();y=20}
      doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...C.ink);doc.text("Perfil do sensor (AGP)",M,y);
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...C.muted);
      doc.text(`${Sn.dias.length} dias de sensor (${dmy(Sn.dias[0])} a ${dmy(Sn.dias[Sn.dias.length-1])}) · média ${n0(Sn.media)} mg/dL · coeficiente de variação ${Sn.cv==null?"-":n0(Sn.cv)+"%"} · ${n0(Math.min(100,Sn.cobertura))}% do tempo com leitura · ${Sn.n} leituras`,M,y+5);
      const ax=M+7,aw=CW-7,ah=48,at=y+10;
      const lo=Math.max(0,Math.floor((Math.min(...horasOk.map(h=>h.p5))-10)/50)*50),hi=Math.max(lo+100,Math.ceil((Math.max(...horasOk.map(h=>h.p95))+10)/50)*50);
      axis(ax,at,aw,ah,lo,hi);
      const hx=i=>ax+(i+.5)/24*aw, hy=v=>at+ah-(v-lo)/(hi-lo)*ah;
      [0,6,12,18,24].forEach(h=>{doc.setFontSize(6.5);doc.setTextColor(...C.muted);doc.text(h+"h",ax+h/24*aw,at+ah+4,{align:"center"})});
      const trechos=[];horasOk.forEach(h=>{const t=trechos[trechos.length-1];if(t&&t[t.length-1].i===h.i-1)t.push(h);else trechos.push([h])});
      // polígono preenchido a partir de pontos absolutos (doc.lines usa deslocamentos relativos)
      const poli=(pts,cor)=>{doc.setFillColor(...cor);doc.lines(pts.slice(1).map((p,k)=>[p[0]-pts[k][0],p[1]-pts[k][1]]),pts[0][0],pts[0][1],[1,1],"F",true)};
      const F90=C.accent.map(c=>Math.round(255-(255-c)*.16)), F50=C.accent.map(c=>Math.round(255-(255-c)*.38));
      trechos.forEach(t=>{
        const faixa=(a,b)=>t.length>1?[...t.map(h=>[hx(h.i),hy(h[a])]),...t.slice().reverse().map(h=>[hx(h.i),hy(h[b])])]
          :[[hx(t[0].i)-1,hy(t[0][a])],[hx(t[0].i)+1,hy(t[0][a])],[hx(t[0].i)+1,hy(t[0][b])],[hx(t[0].i)-1,hy(t[0][b])]];
        poli(faixa("p95","p5"),F90);poli(faixa("p75","p25"),F50);
        doc.setDrawColor(...C.accent);doc.setLineWidth(0.6);
        for(let k=1;k<t.length;k++)doc.line(hx(t[k-1].i),hy(t[k-1].med),hx(t[k].i),hy(t[k].med));
      });
      const lx=W-M-62;doc.setFontSize(7);doc.setTextColor(...C.muted);
      [[C.accent,"Mediana"],[F50,"25-75%"],[F90,"5-95%"]].forEach(([c,l],k)=>{doc.setFillColor(...c);doc.rect(lx+k*21,y-2.6,2.5,2.5,"F");doc.text(l,lx+k*21+3.5,y-0.3)});
      y=at+ah+13;
    }

    // hipoglicemias
    if(R.hipos.length){
      const HY=[176,37,74];
      doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...HY);doc.text("Episódios de hipoglicemia ("+R.hipos.length+")",M,y);
      table(doc,{startY:y+3,margin:{left:M,right:M,bottom:18},theme:"grid",
        head:[["Data","Hora","Glicemia","Situação","Sintomas","O que foi feito","Nova medição"]],
        body:R.hipos.map(x=>[shortDate(x.iso),x.hora||"",x.lo?"LO":has(x.valor)?n0(+x.valor):"não medida",x.situacao||"",(x.sintomas||[]).join(", "),
          [x.tratamento,x.obs&&("Obs.: "+x.obs)].filter(Boolean).join("\n"),has(x.nova)?n0(+x.nova)+(x.novaHora?" ("+x.novaHora+")":""):"-"]),
        styles:{font:"helvetica",fontSize:7.8,cellPadding:1.5,lineColor:C.line,textColor:C.ink,valign:"top"},
        headStyles:{fillColor:HY,textColor:255,fontStyle:"bold"},
        columnStyles:{0:{cellWidth:18,fontStyle:"bold"},1:{cellWidth:11,halign:"center"},2:{cellWidth:16,halign:"center",fontStyle:"bold"},3:{cellWidth:24},4:{cellWidth:32},6:{cellWidth:20,halign:"center"}}});
      y=doc.lastAutoTable.finalY+10;

    const section=(title,opts)=>{if(y>262){doc.addPage();y=20}
      doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...C.ink);doc.text(title,M,y);
      table(doc,Object.assign({startY:y+3,margin:{left:M,right:M,bottom:18},theme:"grid",

    if(R.rows.some(r=>r.da||r.dd)){
      const med=d=>d?n0(d.med):"-", fx=d=>d&&d.n>=MIN_CAIXA?n0(d.p25)+"-"+n0(d.p75):"-", mm=d=>d?n0(d.min)+"-"+n0(d.max):"-";
      section("Perfil por refeição (espalhamento das medições)",{head:[["Refeição","Antes\nmediana","Antes\n25-75%","Antes\nmín-máx","2h depois\nmediana","2h depois\n25-75%","2h depois\nmín-máx"]],
        body:R.rows.map(r=>[r.x.n,med(r.da),fx(r.da),mm(r.da),med(r.dd),fx(r.dd),mm(r.dd)]),
        styles:{font:"helvetica",fontSize:7.8,cellPadding:1.5,lineColor:C.line,textColor:C.ink,halign:"center"},columnStyles:{0:{halign:"left",fontStyle:"bold"}}});

    if(R.nLocais)section("Locais de aplicação ("+R.nLocais+" com local anotado)",{head:[["Local","Vezes no período","Última vez"]],
      body:R.locais.map(x=>[x.l.n,String(x.n),x.ultimo?shortDate(x.ultimo):"-"]),columnStyles:{1:{halign:"center"},2:{halign:"center"}}});
    if(R.tags.length)section("Refeições com etiqueta",{head:[["Etiqueta","Refeições","Antes média","2h depois média"]],

    if(R.extras.length)section("Outras medições (fora das refeições; não entram nas médias)",{head:[["Data","Hora","Glicemia","Momento","Observações"]],
      body:R.extras.map(x=>[shortDate(x.iso),x.hora||"",x.lo?"LO":x.hi?"HI":has(x.valor)?n0(+x.valor):"-",x.momento||"",x.obs||""]),
      columnStyles:{0:{cellWidth:20,fontStyle:"bold"},1:{cellWidth:12,halign:"center"},2:{cellWidth:16,halign:"center"},3:{cellWidth:40}}});
    if(y>262){doc.addPage();y=20}

    // registro dia a dia
    if(R.isos.length){
    doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...C.ink);doc.text("Registro dia a dia",M,y);
    const body=[],dayIdx=[];
    R.isos.slice().reverse().forEach((iso,di)=>{let first=true;
      MEALS.forEach(x=>{const m=mealOf(iso,x.k);if(!mealFilled(m))return;
        body.push([first?shortDate(iso):"",x.n,has(m.antes)?n0(+m.antes):"-",has(m.insulina)?n1(+m.insulina):"-",has(m.depois)?n0(+m.depois):"-",has(m.carbo)?n1(+m.carbo):"-",m.comeu||"",[m.local&&"Aplicação: "+localNome(m.local),(m.tags||[]).join(", "),m.obs].filter(Boolean).join(" · ")]);
        dayIdx.push(di);first=false})});
    table(doc,{startY:y+3,margin:{left:M,right:M,bottom:18},theme:"plain",
      head:[["Data","Refeição","Antes","Insul.","2h dep.","Carbo (g)","O que comeu e bebeu","Observações"]],body,
      styles:{font:"helvetica",fontSize:7.8,cellPadding:1.5,textColor:C.ink,valign:"top"},
      headStyles:{fillColor:C.accent,textColor:255,fontStyle:"bold"},
      columnStyles:{0:{cellWidth:20,fontStyle:"bold"},1:{cellWidth:24},2:{cellWidth:12,halign:"center"},3:{cellWidth:11,halign:"center"},4:{cellWidth:13,halign:"center"},5:{cellWidth:13,halign:"center"},7:{cellWidth:34,textColor:C.muted}},
      didParseCell:d=>{if(d.section==="body"&&dayIdx[d.row.index]%2===1)d.cell.styles.fillColor=C.soft2},
      willDrawCell:d=>{if(d.section==="body"&&d.row.cells[0].raw&&d.row.index>0){doc.setDrawColor(...C.line);doc.setLineWidth(0.3);doc.line(d.cell.x,d.cell.y,d.cell.x+d.cell.width,d.cell.y)}}});
    }

    // rodapé
    const pages=doc.getNumberOfPages();
    for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(...C.muted);
      doc.text("Registro para acompanhamento. Metas de glicemia, doses de insulina e decisões de tratamento seguem a equipe médica responsável.",M,289);
      doc.text("Página "+p+" de "+pages,W-M,289,{align:"right"})}
    return doc.output("arraybuffer");
  }

    const ro=S.readOnly||S.mode==="offline";
    root.innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
      <header><div><h3 id="sheet-title">${x.n}</h3><p>${esc(longDate(iso))}</p>${autoriaLinha(m)}</div><button type="button" class="iconbtn" id="close" aria-label="Fechar">×</button></header>

  function setEditorSaving(saving){
    if(S.editing)S.editing.saving=saving;
    const form=$("form")||$("hform")||$("xform");if(!form)return;
    form.setAttribute("aria-busy",saving?"true":"false");
